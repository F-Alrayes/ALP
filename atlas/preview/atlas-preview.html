<title>Atlas Responsibility Routing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --ground:#FBF8F0; --surface:#FFFFFF; --surface-2:#F5F0E3; --surface-3:#EDE6D4;
  --line:#E4DCC8; --line-soft:#F0EADB;
  --ink:#17241E; --ink-2:#55655C; --ink-3:#7C8A82;
  --gold:#B98B0A; --gold-ink:#8A6707; --gold-soft:#F6EFD6;
  --green:#0F8A5F; --green-deep:#123528; --green-soft:#E3F0E9;
  --critical:#C0392F; --critical-soft:#FAE7E4;
  --warn:#B4761C; --warn-soft:#FBF0DB;
  --s1:#0F8A5F;  /* chart series 1 - validated */
  --s2:#B98B0A;  /* chart series 2 - validated */
  /* Team hues. Muted and close in chroma so six of them on screen read as one
     family rather than a rainbow. They label a node, never encode a quantity. */
  --dept-a:#8A6E1A; --dept-b:#37697F; --dept-c:#6E5580; --dept-d:#2F7D74;
  --dept-e:#A0663F; --dept-f:#1F7A5A;
  --grid:#EDE6D4;
  --shadow:0 1px 2px rgba(18,53,40,.05), 0 8px 24px -18px rgba(18,53,40,.35);
  --r:10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#0D1A15; --surface:#14241D; --surface-2:#1B2F26; --surface-3:#22392F;
    --line:#263B31; --line-soft:#1E322A;
    --ink:#E9E4D6; --ink-2:#A9B8AE; --ink-3:#7E8F85;
    --gold:#B08E2A; --gold-ink:#DCC167; --gold-soft:#2C2718;
    --green:#25A075; --green-deep:#B7DCC9; --green-soft:#152E25;
    --critical:#E8756F; --critical-soft:#33201E;
    --warn:#D8A34B; --warn-soft:#2E2617;
    --s1:#25A075; --s2:#B08E2A;
    --dept-a:#C4A44E; --dept-b:#7FAAC2; --dept-c:#AE93C0; --dept-d:#5FB3A8;
    --dept-e:#D2966E; --dept-f:#4FB088;
    --grid:#263B31;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] {
  --ground:#0D1A15; --surface:#14241D; --surface-2:#1B2F26; --surface-3:#22392F;
  --line:#263B31; --line-soft:#1E322A;
  --ink:#E9E4D6; --ink-2:#A9B8AE; --ink-3:#7E8F85;
  --gold:#B08E2A; --gold-ink:#DCC167; --gold-soft:#2C2718;
  --green:#25A075; --green-deep:#B7DCC9; --green-soft:#152E25;
  --critical:#E8756F; --critical-soft:#33201E;
  --warn:#D8A34B; --warn-soft:#2E2617;
  --s1:#25A075; --s2:#B08E2A;
  --dept-a:#C4A44E; --dept-b:#7FAAC2; --dept-c:#AE93C0; --dept-d:#5FB3A8;
  --dept-e:#D2966E; --dept-f:#4FB088;
  --grid:#263B31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
}

/* ------------------------------------------------------------------ base */
*, *::before, *::after { box-sizing:border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 { margin:0; font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
  font-weight:600; letter-spacing:-.012em; text-wrap:balance; color:var(--ink); }
h1 { font-size:2.05rem; line-height:1.12; }
h2 { font-size:1.28rem; line-height:1.2; }
h3 { font-size:1.02rem; }
p { margin:0; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--gold-ink); }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
.mono { font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric:tabular-nums; }
.num { font-variant-numeric:tabular-nums; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ------------------------------------------------------------------ shell */
.app { display:flex; flex-direction:column; min-height:100vh; }
.topbar { display:flex; align-items:center; gap:20px; padding:0 24px;
  border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:35; }
.topbar .brand { padding:11px 0; flex:none; }
.topbar .brand .mark { width:27px; height:27px; border-radius:7px; font-size:.86rem; margin-right:8px; }
.topbar .brand .name { font-size:1rem; letter-spacing:.06em; color:var(--ink); }
.topbar .tabs { flex:1; margin:0; border-bottom:none; }
.topbar .who { flex:none; }
.topbar .who select { background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-size:.84rem; max-width:190px; color:var(--ink); }
@media (max-width:760px) {
  .topbar { flex-wrap:wrap; gap:9px; padding:9px 14px; }
  .topbar .tabs { order:3; width:100%; }
}
.canvas { min-width:0; padding:24px 30px 64px; flex:1; }
.wrap { max-width:1120px; margin:0 auto; }
.wrap.wide { max-width:1500px; }
.app.chatmode .canvas { padding-bottom:0; }
@media (max-width:900px) { .canvas { padding:18px 16px 56px; } }

/* --------------------------------------------------------------- brand */
.brand { display:inline-flex; align-items:center; }
.brand .mark { display:inline-flex; align-items:center; justify-content:center;
  border-radius:8px; background:var(--gold); color:#12211A; font-weight:800;
  font-family:"Source Serif 4", serif; flex:none; }
.brand .name { font-family:"Source Serif 4", serif; font-weight:600; letter-spacing:.05em; }
.agent-dot { width:8px; height:8px; border-radius:50%; background:var(--gold);
  display:inline-block; margin-right:7px; vertical-align:1px; }
@media (prefers-reduced-motion: no-preference) {
  .agent-dot.live { animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
}

/* -------------------------------------------------------------- nav tabs */
.tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line);
  margin-bottom:22px; }
.tab { background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
  padding:9px 14px; font-size:.9rem; font-weight:500; color:var(--ink-3); border-radius:6px 6px 0 0; }
.tab:hover { color:var(--ink); background:var(--surface-2); }
.tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--gold); font-weight:600; }

/* ------------------------------------------------------------ page header */
.phead { margin-bottom:22px; }
.eyebrow { font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold-ink); font-weight:600; margin-bottom:7px; }
.phead p { color:var(--ink-2); margin-top:7px; max-width:66ch; }

/* ------------------------------------------------------------------ cards */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px; box-shadow:var(--shadow); }
.card + .card { margin-top:9px; }
.card.flag { border-left:3px solid var(--gold); }
.card.alarm { border-left:3px solid var(--critical); }
.card-t { font-weight:600; font-size:.97rem; }
.card-m { color:var(--ink-2); font-size:.82rem; margin-top:3px;
  display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.card-b { margin-top:9px; font-size:.9rem; color:var(--ink-2); white-space:pre-wrap; }
.rowline { display:flex; gap:12px; align-items:center; }
.rowline > .card { flex:1; margin:0; }
.stack { display:flex; flex-direction:column; gap:9px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px; }
.charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(440px,1fr)); gap:18px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px;
  margin-bottom:26px; }

/* ------------------------------------------------------------------ tiles */
.tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 15px; box-shadow:var(--shadow); }
.tile .l { font-size:.66rem; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; }
.tile .v { font-family:"Source Serif 4",serif; font-size:1.85rem; font-weight:600;
  line-height:1.2; margin-top:4px; font-variant-numeric:tabular-nums; }
.tile .s { font-size:.78rem; color:var(--ink-3); }
.tile.warn { border-left:3px solid var(--warn); }
.tile.bad  { border-left:3px solid var(--critical); }
.tile.good { border-left:3px solid var(--green); }

/* ----------------------------------------------------------------- badges */
.b { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px;
  font-size:.71rem; font-weight:600; letter-spacing:.01em; border:1px solid transparent;
  white-space:nowrap; }
.b.pending{background:var(--warn-soft);color:var(--warn);border-color:currentColor}
.b.acknowledged{background:var(--green-soft);color:var(--green);border-color:currentColor}
.b.in_progress{background:var(--gold-soft);color:var(--gold-ink);border-color:currentColor}
.b.completed{background:var(--green-soft);color:var(--green);border-color:currentColor}
.b.escalated{background:var(--critical-soft);color:var(--critical);border-color:currentColor}
.b.ooo{background:var(--warn-soft);color:var(--warn);border-color:currentColor}
.b.role{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.b.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:currentColor}
.b.mute{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }

/* ------------------------------------------------- the audit-trail motif */
.trail { position:relative; margin:4px 0 4px 7px; padding-left:19px;
  border-left:1px solid var(--line); }
.trail .node { position:relative; padding:8px 0; }
.trail .node::before { content:""; position:absolute; left:-24px; top:14px; width:9px; height:9px;
  border-radius:50%; background:var(--ink-3); box-shadow:0 0 0 3px var(--surface); }
.trail .node.ok::before{background:var(--green)}
.trail .node.warn::before{background:var(--warn)}
.trail .node.fail::before{background:var(--critical)}
.trail .node.agent::before{background:var(--gold)}
.trail .k { font-weight:600; font-size:.86rem; }
.trail .d { font-size:.86rem; color:var(--ink-2); }
.trail .w { font-size:.72rem; color:var(--ink-3); letter-spacing:.02em; }
.trail .who { color:var(--gold-ink); font-weight:600; }

/* --------------------------------------------------------------- controls */
.btn { background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:8px 14px; font-size:.88rem; font-weight:500; cursor:pointer; color:var(--ink);
  transition:border-color .12s ease, background .12s ease; }
.btn:hover { border-color:var(--green); }
.btn.primary { background:var(--green-deep); border-color:var(--green-deep); color:#F5F0E3; }
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn.primary { background:var(--green); border-color:var(--green); color:#08150F; }
}
:root[data-theme="dark"] .btn.primary { background:var(--green); border-color:var(--green); color:#08150F; }
.btn.primary:hover { filter:brightness(1.08); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.sm { padding:5px 11px; font-size:.81rem; }
.btn.link { background:none; border:none; padding:0; color:var(--gold-ink);
  text-decoration:underline; text-underline-offset:3px; }
.field { width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:8px; padding:9px 11px; font-size:.9rem; }
textarea.field { resize:vertical; min-height:96px; font-family:inherit; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip { background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:6px 13px; font-size:.82rem; cursor:pointer; color:var(--ink-2); }
.chip:hover { border-color:var(--gold); color:var(--ink); }
.toolbar { display:flex; gap:9px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.toolbar .grow { flex:1; min-width:190px; }
label.lbl { display:block; font-size:.73rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; margin-bottom:5px; }

/* ------------------------------------------------------------------ misc */
.empty { border:1px dashed var(--line); border-radius:var(--r); padding:30px 20px;
  text-align:center; color:var(--ink-3); background:var(--surface); }
.empty .big { color:var(--ink); font-weight:600; margin-bottom:4px; }
.note { border-radius:8px; padding:10px 13px; font-size:.87rem; border:1px solid; }
.note.info { background:var(--green-soft); border-color:var(--green); color:var(--ink); }
.note.warn { background:var(--warn-soft); border-color:var(--warn); color:var(--ink); }
.note.bad  { background:var(--critical-soft); border-color:var(--critical); color:var(--ink); }
.kv { font-size:.87rem; padding:3px 0; display:flex; gap:10px; }
.kv .k { color:var(--ink-3); min-width:124px; flex:none; }
.sub { color:var(--ink-2); font-size:.87rem; }
.muted { color:var(--ink-3); font-size:.8rem; }
.sect { margin:26px 0 12px; display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; }
.sect p { color:var(--ink-2); font-size:.85rem; }
.tblwrap { overflow-x:auto; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); }
table { border-collapse:collapse; width:100%; font-size:.86rem; }
th { text-align:left; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:10px 13px; border-bottom:1px solid var(--line);
  white-space:nowrap; }
td { padding:9px 13px; border-bottom:1px solid var(--line-soft); }
tr:last-child td { border-bottom:none; }
td.n { text-align:right; font-variant-numeric:tabular-nums; }
.flash { position:fixed; right:18px; bottom:18px; z-index:40; max-width:340px;
  background:var(--green-deep); color:#F5F0E3; padding:11px 15px; border-radius:9px;
  font-size:.87rem; box-shadow:0 10px 30px -8px rgba(0,0,0,.45); }
@media (prefers-reduced-motion: no-preference) { .flash { animation:rise .22s ease-out; } }
@keyframes rise { from { transform:translateY(7px); opacity:0 } }

/* ----------------------------------------------------------------- charts */
.chart { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px 11px; box-shadow:var(--shadow); }
.chart h3 { font-family:"IBM Plex Sans",sans-serif; font-size:.92rem; font-weight:600; }
.chart .csub { font-size:.78rem; color:var(--ink-3); margin-top:2px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; margin:9px 0 3px; font-size:.79rem;
  color:var(--ink-2); }
.legend i { width:10px; height:10px; border-radius:3px; display:inline-block;
  margin-right:5px; vertical-align:-1px; }
.chart svg { display:block; width:100%; height:auto; overflow:visible; }
.chart .gl { stroke:var(--grid); stroke-width:1; }
.chart .axl { fill:var(--ink-3); font-size:11px; font-family:"IBM Plex Mono",monospace; }
.chart .vl { fill:var(--ink-2); font-size:11px; font-weight:600;
  font-family:"IBM Plex Mono",monospace; }
.chart .cat { fill:var(--ink-2); font-size:11.5px; }
.bar { transition:opacity .12s ease; }
.bar:hover { opacity:.78; }
.tip { position:fixed; z-index:50; pointer-events:none; background:var(--ink);
  color:var(--surface); font-size:.79rem; padding:7px 10px; border-radius:7px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.5); max-width:250px; }
.tip .tt { font-weight:600; }
.gnode { cursor:default; }
.focusbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:11px 0 0;
  padding:9px 13px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface-2); font-size:.85rem; }
.focusbar.on { border-color:var(--gold); background:var(--gold-soft); }
.focusbar .fb-label { font-weight:600; }
.focusbar .chips { gap:5px; }

/* --------------------------------------------------- full-bleed org chart */
.app.orgmode .canvas { display:flex; flex-direction:column; height:calc(100vh - 50px);
  padding:16px 24px 0; }
/* margin:0 auto on the cross axis beats align-items:stretch, so clear it. */
.app.orgmode .wrap { display:flex; flex-direction:column; flex:1; min-height:0;
  max-width:none; width:100%; margin:0; }
.app.orgmode #page { display:flex; flex-direction:column; flex:1; min-height:0; }
.app.orgmode .tabs { margin-bottom:14px; }

.orgtools { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:11px; }
.findwrap { position:relative; flex:1; min-width:230px; max-width:380px; }
.field.slim { width:auto; min-width:170px; padding:8px 11px; font-size:.86rem; }
.suggest-list { position:absolute; z-index:30; top:calc(100% + 5px); left:0; right:0;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.4); overflow:hidden; }
.sug { display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
  padding:9px 13px; border-bottom:1px solid var(--line-soft); }
.sug:last-child { border-bottom:none; }
.sug:hover, .sug.on { background:var(--gold-soft); }
.sug .sug-n { display:block; font-weight:600; font-size:.9rem; color:var(--ink); }
.sug .sug-t { display:block; font-size:.78rem; color:var(--ink-3); }

/* A flex chain rather than height:100% — a percentage height against a parent
   that is itself stretched by flex resolves to auto in Chromium. */
.orgstage { position:relative; flex:1; min-height:340px; margin-bottom:16px;
  display:flex; flex-direction:column; }
.orgstage .orgscroll { flex:1; min-height:0; border-radius:var(--r); padding:26px;
  display:flex; justify-content:safe center; align-items:safe center; }
/* The chart is a flex item: without this it shrinks back to the container and
   zooming changes nothing but the label. */
.orgstage .orgscroll > svg { flex:none; }
.orgpanel { position:absolute; top:14px; right:14px; width:302px; z-index:12;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; box-shadow:0 14px 36px -14px rgba(0,0,0,.4); }
/* -------------------------------------------------- node hover card */
.hovercard { position:absolute; z-index:20; width:286px; transform-origin:top left;
  background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:13px 15px;
  box-shadow:0 18px 44px -16px rgba(0,0,0,.45); font-size:.87rem; }
.hovercard .hc-head { display:flex; gap:10px; align-items:center; margin-bottom:9px; }
.hovercard .hc-av { width:34px; height:34px; border-radius:50%; flex:none;
  display:grid; place-items:center; font-weight:700; font-size:.8rem;
  color:var(--d); background:var(--surface-2);
  background:color-mix(in srgb, var(--d) 15%, var(--surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--d) 32%, var(--surface)); }
.hovercard .kv { gap:8px; }
.hovercard .kv .k { min-width:78px; }
.hovercard .acts { margin-top:10px; }
@media (prefers-reduced-motion: no-preference) { .hovercard { animation:hcin .13s ease-out; } }
@keyframes hcin { from { opacity:0; transform:translateY(-3px); } }

/* -------------------------------------------------------- More menu */
.morewrap { position:relative; margin-left:auto; }
.tab.more .caret { font-size:.7rem; opacity:.7; }
.tab.more.on { color:var(--ink); border-bottom-color:var(--gold); font-weight:600; }
.moremenu { position:absolute; right:0; top:calc(100% + 4px); z-index:40; min-width:206px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.4); }
.moremenu button { display:block; width:100%; text-align:left; background:none; border:none;
  padding:9px 14px; font-size:.87rem; cursor:pointer; color:var(--ink);
  border-bottom:1px solid var(--line-soft); }
.moremenu button:last-child { border-bottom:none; }
.moremenu button:hover, .moremenu button.on { background:var(--gold-soft); }

.orgpanel .kv { gap:8px; }
.orgpanel .kv .k { min-width:84px; }
.orglegend { position:absolute; left:14px; bottom:12px; z-index:11; display:flex; gap:11px;
  flex-wrap:wrap; font-size:.73rem; color:var(--ink-2); background:var(--surface);
  border:1px solid var(--line); border-radius:999px; padding:5px 13px; opacity:.94; }
.orglegend i { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:4px; }
.orglegend .ooo-dot { width:8px; height:8px; border-radius:50%; background:var(--warn);
  display:inline-block; margin-right:4px; }
@media (max-width:900px) {
  .app.orgmode .canvas { height:auto; }
  .orgstage { min-height:60vh; }
  .orgpanel { position:static; width:auto; margin-top:11px; }
}
</style>
<div id="root"></div>
<div id="tip" class="tip" hidden></div>

<style>
/* ------------------------------------------------------------------ chat */
.chatpage { display:flex; flex-direction:column; height:calc(100vh - 150px); min-height:420px; }
.chatlog { flex:1; overflow-y:auto; padding:4px 2px 16px; scroll-behavior:smooth; }
.msg { display:flex; gap:11px; margin-bottom:16px; max-width:760px; }

            <button class="btn primary" data-act="adv" data-h="48">+48h</button>
            <button class="btn" data-act="clockreset">Reset</button>
          </div>
        </div>

        <div class="card">
          <div class="card-t">Out of office</div>
          <p class="sub small" style="margin-top:7px">The agent reroutes their open work
            to a delegate.</p>
          <div class="acts">
            <select class="field slim" data-act="oooperson" aria-label="Person">${
              people.map(opt).join("")}</select>
            <button class="btn" data-act="ooo">${away ? "Bring back" : "Mark away"}</button>
          </div>
        </div>

        <div class="card">
          <div class="card-t"><span class="agent-dot live"></span>Agent</div>
          <p class="sub small" style="margin-top:7px">Every 2s · last pass ${
            esc(S.lastTickAt ? fmtTime(S.lastTickAt) : "—")}</p>
          <div class="acts"><button class="btn" data-act="tick">Run it now</button></div>
        </div>

        <div class="card">
          <div class="card-t">Start over</div>
          <p class="sub small" style="margin-top:7px">Back to the starting state.</p>
          <div class="acts"><button class="btn" data-act="reseed">Reset &amp; reseed</button></div>
        </div>
      </div>`;
  }

  /* --------------------------------- shell ------------------------------ */

  // Everyday work stays on the bar; the pitch and admin surfaces sit behind
  // "More", so a first-time employee sees three choices, not six.
  const PRIMARY = [["chat", "Ask"], ["people", "People"], ["requests", "Requests"]];
  const MORE = [["processes", "What you can ask for"], ["dashboard", "Dashboard"],
                ["agentlog", "Agent log"], ["demo", "Demo controls"], ["guide", "Guide"]];
  const LABELS = Object.fromEntries(PRIMARY.concat(MORE));

  function render() {
    const root = document.getElementById("root");
    const orgMode = UI.page === "people" && (UI.tab.people || "org") === "org";
    const inMore = MORE.some(([k]) => k === UI.page);
    const me = actor();

    const tabs = PRIMARY.map(([k, label]) => {
      const unread = k === "requests" ? unreadFor(UI.actor) : 0;
      return `<button class="tab" role="tab" data-act="page" data-page="${k}"
        aria-selected="${UI.page === k}">${esc(label)}${
          unread ? ` <span class="pip">${unread}</span>` : ""}</button>`;
    }).join("");

    const moreMenu = `<div class="morewrap">
      <button class="tab more${inMore ? " on" : ""}" data-act="moretoggle"
        aria-expanded="${!!UI.moreOpen}" aria-haspopup="menu">${
        esc(inMore ? LABELS[UI.page] : "More")} <span class="caret">▾</span></button>
      ${UI.moreOpen ? `<div class="moremenu" role="menu">${MORE.map(([k, label]) =>
        `<button role="menuitem" data-act="page" data-page="${k}"
          class="${UI.page === k ? "on" : ""}">${esc(label)}</button>`).join("")}</div>` : ""}
    </div>`;

    const whoOpts = S.people.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p =>
      `<option value="${p.id}"${p.id === UI.actor ? " selected" : ""}>${esc(p.name)}</option>`
    ).join("");

    root.innerHTML = `<div class="app${UI.page === "chat" ? " chatmode" : ""}${
      orgMode ? " orgmode" : ""}">
      <header class="topbar">
        <span class="brand"><span class="mark">A</span><span class="name">ATLAS</span></span>
        <nav class="tabs" role="tablist">${tabs}${moreMenu}</nav>
        <label class="who"><span class="sr">You are</span>
          <select data-act="actor">${whoOpts}</select></label>
      </header>
      <main class="canvas"><div class="wrap">
        <div id="page">${pageHTML()}</div>
      </div></main></div>` +
      (UI.flash ? `<div class="flash">${esc(UI.flash)}</div>` : "") +
      (UI.guideOpen ? guideOverlay() : "");

    if (UI.flash) { const f = UI.flash; setTimeout(() => {
      if (UI.flash === f) { UI.flash = null; const el = document.querySelector(".flash");
        if (el) el.remove(); } }, 4200); }
    afterRender();
  }

  function pageHTML() {
    switch (UI.page) {
      case "people":    return pagePeople();
      case "processes": return pageProcesses();
      case "demo":      return pageDemo();
      case "requests":  return pageRequests();
      case "agentlog":  return pageAgentLog();
      case "dashboard": return pageDashboard();
      case "guide":     return pageGuide();
      default:          return pageChat();
    }
  }

  function flash(msg) { UI.flash = msg; }
  function commit(msg) { if (msg) flash(msg); save(); render(); }

  /* ================================= chat =============================== */

  const SUGGESTIONS = [
    "Who do I contact to get my laptop fixed?",
    "Email whoever owns the data room and ask them for access",
    "Ask whoever approves expenses to sign off my claim",
    "What's in my inbox?",
  ];

  function pushMsg(role, kind, data) {
    UI.chat.push({ id: UI.msgSeq++, role, kind, data: data || {}, at: now() });
    if (UI.chat.length > 200) UI.chat.splice(0, UI.chat.length - 200);
  }

  function greet() {
    UI.chat = [];
    pushMsg("bot", "text", { text:
      "Say it how you'd say it out loud. I'll work out who's accountable and send it." });
    pushMsg("bot", "suggest", { items: SUGGESTIONS.slice(0, 3) });
  }

  /* ---------------------------- bot responses --------------------------- */

  // Free text, one entry point. Everything below decides what to do with it;
  // nothing here needs the user to have found anybody in the org chart first.
  function botRequest(u) {
    const query = (u && u.query) || (typeof u === "string" ? u : u.text);
    const matches = E.matchProcesses(S.processes, query, 3);
    const top = matches[0];
    if (!top || top.confidence < 25) {
      // No request type covers it. Before giving up, try the teams — most
      // things people need are somebody's job even when they are nobody's form.
      if (botContact(query)) return;
      pushMsg("bot", "text", { text:
        "I couldn't match that. Pick the closest one, or rephrase it." });
      pushMsg("bot", "pick", { query, options: matches.map(m => m.process_id) });
      return;
    }
    openDraft(query, top.process_id, matches);
  }

  /* -- relays ------------------------------------------------------------
     "Send an email to whoever is responsible for Data and ask them for
     access." Nobody is named, no question is asked, and the user should not
     have to go and look anyone up. Read the sentence, resolve the owner
     through the responsibility graph, and send it. */

  function botRelay(u) {
    const named = u.personId ? person(u.personId) : null;
    const query = u.query || u.text;
    let matches = E.matchProcesses(S.processes, query, 3);

    // A name in the message outranks a keyword hit: prefer what that person is
    // actually on the hook for.
    if (named) {
      const theirs = new Set(E.processesFor(S, named.id).map(x => x.process.id));
      const mine = matches.filter(m => theirs.has(m.process_id) && m.confidence >= 25);
      if (mine.length) matches = mine.concat(matches.filter(m => !mine.includes(m)));
    }

    const top = matches[0];
    if (!top || top.confidence < 25) {
      // Understood the instruction, not the subject.
      if (named) { pushMsg("bot", "askwho", { id: named.id }); return; }
      if (botContact(u.subject || query)) return;
      pushMsg("bot", "text", { text:
        "I can tell you want something raised — I just can't tell what. Pick one:" });
      pushMsg("bot", "pick", { query, options: [] });
      return;
    }

    // Two plausible readings, or one weak one: ask before sending anything.
    const second = matches[1];
    const tooClose = second && second.confidence >= 25 && top.confidence - second.confidence < 20;
    if (tooClose || top.confidence < 55) {
      pushMsg("bot", "choose", { query, text: u.text, subject: u.subject || "",
        ids: matches.filter(m => m.confidence >= 15).slice(0, 3).map(m => m.process_id) });
      return;
    }

    const proc = E.process_(S, top.process_id);
    const res = E.resolve(S, proc);
    const title = E.suggestTitle(u.ask || u.subject || u.text, proc.name);
    const dupes = E.findSimilarOpen(S, { process_id: proc.id, requester_id: UI.actor, title });

    // Anything Atlas can't route cleanly, or that looks like a repeat, goes
    // back to the user before it is sent.
    if (res.needs_admin || res.assignee_id === null || dupes.length) {
      openDraft(u.text, proc.id, matches, title);
      return;
    }

    sendRelay(u, proc, res, title);
  }

  function sendRelay(u, proc, res, title) {
    const me = actor();
    const r = E.createRequest(S, {
      requester_id: UI.actor, process_id: proc.id, assignee_id: res.assignee_id,
      title, body: E.draftBody(me, proc, res, u.text), resolution: res,
    });
    UI.draft = null;
    pushMsg("bot", "sent", { id: r.id, subject: u.subject || "", auto: true });
  }

  // The user picked between two readings. Carry on as if the sentence had been
  // unambiguous — they have already seen who each option would reach.
  function commitChoice(text, processId) {
    const u = E.understand(S, text);
    const proc = E.process_(S, processId);
    if (!proc) return;
    const res = E.resolve(S, proc);
    const title = E.suggestTitle(u.ask || u.subject || text, proc.name);
    const dupes = E.findSimilarOpen(S, { process_id: proc.id, requester_id: UI.actor, title });
    if (res.needs_admin || res.assignee_id === null || dupes.length) {
      openDraft(text, proc.id, null, title);
      return;
    }
    sendRelay(u, proc, res, title);
  }

  function openDraft(query, processId, matches, title) {
    const proc = E.process_(S, processId);
    const res = E.resolve(S, proc);
    const me = actor();
    UI.draft = {
      query, processId,
      title: title || E.suggestTitle(query, proc ? proc.name : null),
      body: E.draftBody(me, proc, res, query),
    };
    pushMsg("bot", "match", {
      query, processId,
      matchIds: (matches || E.matchProcesses(S.processes, query, 3)).map(m => m.process_id),
    });
  }

  function botWhoOwns(text) {
    const proc = E.findProcess(S, text);
    if (proc) { pushMsg("bot", "owners", { processId: proc.id }); return; }
    // No request type covers it — "who do I contact to get my laptop fixed" is
    // still a fair question, and the team vocabulary can answer it.
    if (botContact(text)) return;
    pushMsg("bot", "text", { text:
      "I don't know who covers that. Try naming the thing itself — a laptop, an " +
      "invoice, a contract — or browse People." });
  }

  // Route a problem to a team when no process matches. Returns false if even
  // the team vocabulary draws a blank, so the caller can say so plainly.
  function botContact(text) {
    const found = E.matchDepartments(S, text, 2);
    const top = found[0];
    if (!top || top.confidence < 25 || !top.person_id) return false;
    pushMsg("bot", "contact", { query: text, deptId: top.department_id });
    return true;
  }

  // "Who do I contact to get my laptop fixed" is a routing question wrapped
  // round a need. Vikram should receive the need, not the question.
  const CONTACT_FRAMING = new RegExp(
    "^\\s*(?:who\\s+(?:do|should|would|can|could)\\s+(?:i|we)(?:\\s+need\\s+to|\\s+have\\s+to)?\\s*" +
    "(?:contact|ask|speak\\s+to|speak\\s+with|talk\\s+to|go\\s+to|see|email|call|chase)" +
    "|who\\s+(?:looks\\s+after|deals\\s+with|sorts\\s+out|takes\\s+care\\s+of|fixes|handles)" +
    "|where\\s+do\\s+i\\s+(?:go|start))" +
    "\\s*(?:to|about|for|with|regarding)?\\s*", "i");

  function askedFor(text) {
    const stripped = String(text || "").replace(CONTACT_FRAMING, "").trim().replace(/[?]+$/, "");
    return stripped.length >= 3 ? stripped : String(text || "").trim();
  }

  function sendToContact(text, deptId) {
    const found = E.matchDepartments(S, text, 3);
    const contact = found.find(c => c.department_id === deptId) || found[0];
    if (!contact) return;
    const res = E.resolveContact(S, contact);
    if (res.assignee_id === null) {
      pushMsg("bot", "text", { text:
        `Everyone I'd send this to in ${contact.department_name} is away. ` +
        `Try again tomorrow, or pick someone in People.` });
      return;
    }
    const r = E.createRequest(S, {
      requester_id: UI.actor, process_id: null, assignee_id: res.assignee_id,
      title: E.suggestTitle(askedFor(text), contact.department_name),
      // draftBody only reads the name off this, and naming the team beats
      // telling the recipient they have received "an unmatched request".
      body: E.draftBody(actor(), { name: contact.department_name }, res, askedFor(text)),
      resolution: res,
    });
    UI.draft = null;
    pushMsg("bot", "sent", { id: r.id, auto: true, team: contact.department_name });
  }

  function botOoo() {
    const at = now();
    const away = S.people.filter(p => E.isOutOfOffice(p, at))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!away.length) {
      pushMsg("bot", "text", { text: "Nobody is marked out of office right now." });
      return;
    }
    pushMsg("bot", "ooo", { ids: away.map(p => p.id) });
  }

  function botInbox() {
    const rows = S.requests.filter(r => r.assignee_id === UI.actor &&
      E.OPEN_STATUSES.includes(r.status)).sort((a, b) => b.last_action_at - a.last_action_at);
    pushMsg("bot", "reqlist", { ids: rows.map(r => r.id), mine: false,
      empty: "Nothing is sitting with you right now." });
  }

  function botMyRequests() {
    const rows = S.requests.filter(r => r.requester_id === UI.actor)
      .sort((a, b) => b.created_at - a.created_at);
    pushMsg("bot", "reqlist", { ids: rows.map(r => r.id), mine: true,
      empty: "You haven't raised anything yet. Tell me what you need and I'll route it." });
  }

  function botAbout(u) {
    const p = u.personId ? person(u.personId) : E.findPerson(S, u.text);
    if (!p) {
      pushMsg("bot", "text", { text:
        "I couldn't find them. Try their full name, or browse People." });
      return;
    }
    pushMsg("bot", "person", { id: p.id });
  }

  // Reached from the org chart: scope the conversation to one person.
  function botAskWho(personId) {
    pushMsg("bot", "askwho", { id: personId });
  }

  function botHelp() {
    pushMsg("bot", "text", { text:
      "Describe the problem, not the paperwork. \"Who do I contact to get my " +
      "laptop fixed?\" and \"email whoever owns the data room and ask for access\" " +
      "both work — I'll find the right person and send it.\n\n" +
      "Once sent, I chase after 48h, hand over to a cover, then escalate." });
    pushMsg("bot", "suggest", { items: SUGGESTIONS });
  }

  function submitChat(text) {
    text = String(text || "").trim();
    if (!text) return;
    pushMsg("user", "text", { text });
    UI.draft = null;
    const u = E.understand(S, text);
    switch (u.intent) {
      case "help":        botHelp(); break;
      case "who_ooo":     botOoo(); break;
      case "who_owns":
      case "who_to_contact": botWhoOwns(text); break;
      case "my_inbox":    botInbox(); break;
      case "my_requests": botMyRequests(); break;
      case "about":       botAbout(u); break;
      default:            u.relay ? botRelay(u) : botRequest(u);
    }
  }

  /* ------------------------------ rendering ----------------------------- */

  function bubbleUser(m) {
    return `<div class="msg user"><div class="bub">${esc(m.data.text)}</div></div>`;
  }

  function botWrap(inner, extraClass) {
    return `<div class="msg bot ${extraClass || ""}">
      <div class="ava" aria-hidden="true">A</div><div class="bub">${inner}</div></div>`;
  }

  function renderMatch(m) {
    const { query, processId, matchIds } = m.data;
    const proc = E.process_(S, processId);
    const all = E.matchProcesses(S.processes, query, 3);
    const top = all.find(x => x.process_id === processId) || all[0];
    const res = E.resolve(S, proc);
    const isCurrent = UI.draft && UI.draft.processId === processId && UI.draft.query === query;
    const dupes = isCurrent ? E.findSimilarOpen(S, { process_id: processId,
      requester_id: UI.actor, title: UI.draft.title }) : [];

    const kw = top && top.matched_keywords.length
      ? top.matched_keywords.slice(0, 5).map(k => badge(k, "role")).join(" ") : "";

    // Only offer runners-up that actually scored; a 0% suggestion is noise.
    const alts = (matchIds || []).filter(id => id !== processId)
      .map(id => all.find(x => x.process_id === id))
      .filter(x => x && x.confidence >= 15).slice(0, 2);
    const alternatives = alts.map(x => `<button class="chip sm" data-act="switchproc"
        data-id="${x.process_id}" data-mid="${m.id}">${esc(x.process_name)}
        <span class="muted">${x.confidence.toFixed(0)}%</span></button>`).join("") +
      `<button class="chip sm" data-act="repick">Pick another process</button>`;

    const steps = `<div class="trail tight">` + res.steps.map(s =>
      `<div class="node ${s.outcome}"><div class="k">${esc(s.label)}</div>
       <div class="d">${esc(s.detail)}</div></div>`).join("") + `</div>`;

    const dupeBlock = dupes.length ? `<div class="note warn tight">
        <strong>Possible duplicate.</strong> ${esc(dupes[0].reason)}
        <div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn sm" data-act="follow" data-id="${dupes[0].request.id}">
            Follow #${dupes[0].request.id} instead</button></div></div>` : "";

    const draftBlock = isCurrent ? `
      <div class="draft">
        <label class="lbl" for="dt">Title</label>
        <input id="dt" class="field" data-act="dtitle" value="${esc(UI.draft.title)}">
        <label class="lbl" for="db" style="margin-top:9px">Message to ${esc(res.assignee_name || "the admin")}</label>
        <textarea id="db" class="field" data-act="dbody" rows="7">${esc(UI.draft.body)}</textarea>
        <div class="acts">
          <button class="btn primary" data-act="chatsend">Send it</button>
          <button class="btn" data-act="chatcancel">Cancel</button>
          <span class="muted" style="align-self:center">Not right?</span>${alternatives}
        </div>
      </div>` : `<p class="muted">This draft has been dealt with.</p>`;

    return botWrap(`
      <p>That looks like <strong>${esc(proc.name)}</strong>${top ?
        ` — ${badge(top.confidence.toFixed(0) + "% · " + top.confidence_label,
          top.confidence >= 70 ? "gold" : "mute")}` : ""}</p>
      ${kw ? `<div class="chips tight">${kw}</div>` : ""}
      ${top ? `<details class="why"><summary>Why this match?</summary>
        <p class="sub small">${esc(E.why(top))}</p></details>` : ""}
      <div class="who-now"><span class="lbl">Who it goes to</span>${steps}
        <div class="note ${res.needs_admin ? "bad" : "info"} tight">${esc(E.resolutionSummary(res))}</div>
      </div>
      ${dupeBlock}
      ${draftBlock}`);
  }

  function renderSent(m) {
    if (m.data.withdrawn) return botWrap(`<p>Withdrawn — nothing was sent.</p>`);
    const r = E.request(S, m.data.id);
    if (!r) return botWrap(`<p>That request no longer exists.</p>`);
    const a = r.assignee_id ? person(r.assignee_id) : null;
    const proc = r.process_id ? E.process_(S, r.process_id) : null;
    const res = proc ? E.resolve(S, proc) : null;
    const owner = res && res.owner_id ? person(res.owner_id) : null;

    // Show the lookup, not just the outcome: finding the right person is the
    // work the user skipped by asking Atlas instead of guessing an address.
    let trail = "";
    if (m.data.team) {
      trail = `<p class="sub small">No request type covers this, so it went to
        ${esc(m.data.team)}.</p>`;
    } else if (m.data.auto && owner) {
      const lead = m.data.subject
        ? `Whoever owns <strong>${esc(m.data.subject)}</strong> is <strong>${esc(owner.name)}</strong>`
        : `<strong>${esc(owner.name)}</strong> owns that`;
      trail = `<p class="sub small">${lead}${
        res.rerouted && a && a.id !== owner.id
          ? ` — away until ${esc(E.fmtDate(owner.ooo_until))}, so it went to ${esc(a.name)}, their ${esc(res.assignee_role)}.`
          : `.`}</p>`;
    }

    const undo = E.canWithdraw(S, r.id, UI.actor)
      ? `<button class="btn sm" data-act="undo" data-id="${r.id}" data-mid="${m.id}">Undo</button>` : "";

    return botWrap(`
      <p>Sent. <strong>#${r.id}</strong> is with <strong>${esc(a ? a.name : "the Atlas admin")}</strong>.</p>
      ${trail}
      <div class="card flag tight">
        <div class="card-t">#${r.id} — ${esc(r.title)}</div>
        <div class="card-m">${statusBadge(r.status)}<span>${esc(proc ? proc.name : "No set process")}</span>
          <span class="mono">raised ${esc(human(now() - r.created_at))} ago</span></div>
      </div>
      <p class="sub small">I'll chase it if it isn't picked up in 48h.</p>
      <div class="acts">
        <button class="btn sm" data-act="open" data-id="${r.id}">Timeline</button>
        <button class="btn sm" data-act="adv" data-h="48">Skip 48h</button>
        ${undo}
      </div>`);
  }

  // A question no request type answers. Name the team, the person, and the
  // words that got us there — then offer to just send it.
  function renderContact(m) {
    const found = E.matchDepartments(S, m.data.query, 3);
    const c = found.find(x => x.department_id === m.data.deptId) || found[0];
    if (!c || !c.person_id) return botWrap(`<p>I couldn't work out who covers that.</p>`);
    const p = person(c.person_id);
    const res = E.resolveContact(S, c);
    const away = E.isOutOfOffice(p, now());
    const kw = c.matched_keywords.slice(0, 3).map(k => badge(k, "role")).join(" ");

    return botWrap(`
      <p>That's <strong>${esc(c.department_name)}</strong>.</p>
      <div class="card">
        <div class="card-t">${esc(p.name)} ${away ? badge("away", "ooo") : ""}</div>
        <div class="card-m"><span>${esc(p.title)}</span>${
          // The reason only earns its place when it isn't the job title again.
          c.reason.startsWith("leads") ? `<span>· leads the team</span>` : ""}</div>
      </div>
      ${kw ? `<div class="chips tight">${kw}</div>` : ""}
      ${away && res.assignee_id && res.assignee_id !== p.id
        ? `<p class="sub small">Away until ${esc(E.fmtDate(p.ooo_until))} — this would go to
           ${esc(res.assignee_name)} instead.</p>` : ""}
      <div class="acts">
        <button class="btn primary sm" data-act="sendcontact" data-id="${c.department_id}"
          data-q="${esc(m.data.query)}">Send it to ${esc((res.assignee_name || p.name).split(" ")[0])}</button>
        <button class="btn sm" data-act="treeperson" data-id="${p.id}">Show in the org chart</button>
      </div>`);
  }

  // Two readings of the same sentence. Name the person each would reach, so
  // the choice is about who gets it rather than what it is filed under.
  function renderChoose(m) {
    const rows = m.data.ids.map(id => E.process_(S, id)).filter(Boolean);
    return botWrap(`
      <p>${m.data.subject
        ? `More than one thing covers <strong>${esc(m.data.subject)}</strong>.`
        : `That could be a couple of things.`} Which do you mean?</p>
      <div class="stack tight">${rows.map(p => {
        const res = E.resolve(S, p);
        return `<button class="pickrow" data-act="chose" data-id="${p.id}"
          data-q="${esc(m.data.text || m.data.query)}">

  function renderOwners(m) {

      return `<div class="kv"><span class="k">${esc(role[0].toUpperCase() + role.slice(1))}</span>

  function renderAskWho(m) {

  function renderMsg(m) {
    if (m.role === "user") return bubbleUser(m);
    switch (m.kind) {
      case "match":   return renderMatch(m);

      case "owners":  return renderOwners(m);
      case "ooo":     return renderOoo(m);
      case "reqlist": return renderReqList(m);
      case "person":  return renderPersonMsg(m);
      case "pick":    return renderPick(m);
      case "choose":  return renderChoose(m);
      case "contact": return renderContact(m);
      case "askwho":  return renderAskWho(m);

        return `<div class="chips suggest">${m.data.items.map(s =>
          `<button class="chip" data-act="say" data-text="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
