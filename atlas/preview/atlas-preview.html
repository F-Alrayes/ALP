  function pageChat() {
    return `<div class="chatpage">
      <div class="chatlog" id="chatlog">
        ${UI.chat.map(renderMsg).join("")}
      </div>
      <form class="composer" data-act="chatform">
        <label class="sr" for="composer">Message Atlas</label>
        <textarea id="composer" rows="1" placeholder="Tell Atlas what you need…"
          data-act="composer"></textarea>
        <button class="btn primary" type="submit" data-act="chatsubmit">Send</button>
      </form>
    </div>`;
  }

  /* ============================ people & org tree ======================= */

  const NODE_W = 208, NODE_H = 66, H_GAP = 20, V_GAP = 62;

  const DEPT_HUE = {
    "Executive": "var(--dept-a)", "Finance": "var(--dept-b)",
    "Legal & Compliance": "var(--dept-c)", "IT": "var(--dept-d)",
    "Operations / HR": "var(--dept-e)", "Investments / Deal Team": "var(--dept-f)",
  };
  const deptColor = d => DEPT_HUE[d] || "var(--ink-3)";

  const isCollapsed = id => !!UI.tree.collapsed[id];

  function initials(name) {
    const parts = String(name || "").split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function findNode(roots, id) {
    for (const r of roots) {
      if (r.id === id) return r;
      const found = findNode(r.children, id);
      if (found) return found;
    }
    return null;
  }

  // Best-match first: a name that starts with the term beats one that merely
  // contains it, which beats a title or team hit.
  function searchMatches(term) {
    const t = String(term || "").trim().toLowerCase();
    if (!t) return [];
    const score = p => {
      const n = p.name.toLowerCase();
      if (n.startsWith(t)) return 4;
      if (n.split(" ").some(w => w.startsWith(t))) return 3;
      if (n.includes(t)) return 2;
      if (p.title.toLowerCase().includes(t)) return 1;
      return 0;
    };
    return S.people
      .map(p => ({ p, s: Math.max(score(p),
        E.departmentName(S, p).toLowerCase().includes(t) ? 1 : 0) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.p.name.localeCompare(b.p.name))
      .map(x => x.p);
  }

  // Tidy-tree layout: leaves take the next slot, parents centre over children.
  function layoutTree(roots) {
    const cursor = { x: 0 };
    const placed = [];
    const walk = (node, depth) => {
      const kids = isCollapsed(node.id) ? [] : node.children;
      let x;
      if (!kids.length) {
        x = cursor.x;
        cursor.x += NODE_W + H_GAP;
      } else {
        const childXs = kids.map(k => walk(k, depth + 1));
        x = (childXs[0] + childXs[childXs.length - 1]) / 2;
      }
      placed.push({ node, x, y: depth * (NODE_H + V_GAP), depth });
      return x;
    };
    roots.forEach(r => walk(r, 0));
    const width = Math.max(cursor.x, NODE_W + H_GAP);
    const depth = Math.max(...placed.map(p => p.y)) + NODE_H + 14;
    return { placed, width, height: depth };
  }

  function treeSVG() {
    const dept = UI.tree.dept;
    const forest = E.orgTree(S);
    // Focusing re-roots the chart on one person, which hides everyone above them.
    const focused = UI.tree.root ? findNode(forest, UI.tree.root) : null;
    const roots = focused ? [focused] : forest;
    const { placed, width, height } = layoutTree(roots);
    const byId = new Map(placed.map(p => [p.node.id, p]));
    const at = now();

    const edges = placed.filter(p => p.node.manager_id && byId.has(p.node.manager_id))
      .map(p => {
        const parent = byId.get(p.node.manager_id);
        const x1 = parent.x + NODE_W / 2, y1 = parent.y + NODE_H;
        const x2 = p.x + NODE_W / 2, y2 = p.y;
        const mid = y1 + V_GAP / 2;
        return `<path d="M${x1} ${y1} V${mid} H${x2} V${y2}" fill="none"
          stroke="var(--line)" stroke-width="1.5"/>`;
      }).join("");

    const nodes = placed.map(p => {
      const n = p.node;
      const pers = person(n.id);
      const ooo = pers && E.isOutOfOffice(pers, at);
      const hidden = n.children.length && isCollapsed(n.id);
      const dim = dept !== "All departments" && n.department !== dept;
      const selected = UI.tree.selected === n.id;
      const hue = deptColor(n.department);
      const toggle = n.children.length ? `
        <g class="tgl" data-act="treetoggle" data-id="${n.id}" tabindex="0"
           role="button" aria-label="${hidden ? "Expand" : "Collapse"} ${esc(n.name)}'s team">
          <circle cx="${NODE_W / 2}" cy="${NODE_H + 1}" r="10"
            fill="var(--surface)" stroke="var(--line)"/>
          <text x="${NODE_W / 2}" y="${NODE_H + 5}" text-anchor="middle"
            class="tglt">${hidden ? "+" + n.descendants : "–"}</text>
        </g>` : "";
      const title = n.title.length > 26 ? n.title.slice(0, 24) + "…" : n.title;
      return `<g class="onode${dim ? " dim" : ""}${selected ? " sel" : ""}"
          data-node="${n.id}" style="--d:${hue}" transform="translate(${p.x},${p.y})">
        <g data-act="treeselect" data-id="${n.id}" tabindex="0" role="button"
           aria-label="${esc(n.name)}, ${esc(n.title)}, ${esc(n.department)}">
          <rect class="obox" width="${NODE_W}" height="${NODE_H}" rx="11"/>
          <circle class="oav oavr" cx="30" cy="${NODE_H / 2}" r="15" stroke-width="1"/>
          <text class="oavt" x="30" y="${NODE_H / 2 + 4}" text-anchor="middle">${esc(initials(n.name))}</text>
          <text class="oname" x="55" y="${NODE_H / 2 - 4}">${esc(n.name)}</text>
          <text class="otitle" x="55" y="${NODE_H / 2 + 13}">${esc(title)}</text>
          ${ooo ? `<circle class="oaway" cx="${NODE_W - 15}" cy="17" r="5"/>` : ""}
        </g>${toggle}</g>`;
    }).join("");

    const t = UI.tree;
    return `<svg id="treesvg" viewBox="0 0 ${width} ${height + 24}"
      style="width:${Math.round(width * t.zoom)}px;height:${Math.round((height + 24) * t.zoom)}px"
      role="img" aria-label="Organisation chart of ${S.people.length} people">
      <g>${edges}${nodes}</g></svg>`;
  }

  // Deliberately short: a first-time viewer needs who they are, who they report
  // to, and what they own. Everything else is a click away in Ask Atlas.
  function treeDetail() {
    const id = UI.tree.selected;
    if (!id) return "";
    const p = person(id);
    if (!p) return "";
    const at = now();
    const mgr = p.manager_id ? person(p.manager_id) : null;
    const reports = S.people.filter(x => x.manager_id === id).length;
    const owns = (E.responsibilitiesOf(S, id).owner || []).map(x => x.name);

    return `<div class="side-head">
        <div><h3>${esc(p.name)}</h3><p class="sub">${esc(p.title)}</p></div>
        <button class="btn sm" data-act="treeclose" aria-label="Close">✕</button>
      </div>
      <div class="chips tight">${badge(E.departmentName(S, p), "role")}
        ${E.isOutOfOffice(p, at) ? badge("Away until " + E.fmtDate(p.ooo_until), "ooo") : ""}</div>
      <div class="kv"><span class="k">Reports to</span>${esc(mgr ? mgr.name : "Nobody — top of the firm")}</div>
      ${reports ? `<div class="kv"><span class="k">Team</span>${reports} direct report${
        reports === 1 ? "" : "s"}</div>` : ""}
      <div class="kv"><span class="k">Owns</span>${owns.length
        ? esc(owns.join(", ")) : `<span class="muted">nothing directly</span>`}</div>
      <div class="acts">
        <button class="btn primary sm" data-act="askperson" data-id="${p.id}">Ask them for something</button>
        ${UI.tree.root === p.id
          ? `<button class="btn sm" data-act="focusclear">Show whole firm</button>`
          : `<button class="btn sm" data-act="focusperson" data-id="${p.id}">Show just their team</button>`}
      </div>`;
  }

  function pagePeople() {
    const which = UI.tab.people || "org";
    const tabs = [["org", "Org chart"], ["teams", "Teams"]]
      .map(([k, t]) => `<button class="tab" role="tab" data-act="subtab" data-group="people"
        data-k="${k}" aria-selected="${which === k}">${esc(t)}</button>`).join("");
    const tabsBar = `<div class="tabs" role="tablist">${tabs}</div>`;
    if (which === "org") return tabsBar + orgPanel();
    const head = phead("People", "Teams", "") + tabsBar;
    return head + teamsPanel();
  }

  function orgPanel() {
    const t = UI.tree;
    const legend = Object.keys(DEPT_HUE).map(d =>
      `<span><i style="background:${deptColor(d)}"></i>${esc(d)}</span>`).join("");
    return `<div class="orgtools">
        <div class="findwrap">
          <label class="sr" for="ts">Find someone</label>
          <input id="ts" class="field" data-act="treequery" role="combobox" autocomplete="off"
            aria-expanded="false" aria-controls="suggestbox" aria-autocomplete="list"
            placeholder="Find someone by name…" value="${esc(t.query || "")}">
          <div class="suggest-list" id="suggestbox" role="listbox" aria-label="Matching people" hidden></div>
        </div>
        <select class="field slim" data-act="treedept" aria-label="Highlight a team">
          ${deptOptions(t.dept)}</select>
        <div class="zoomer" role="group" aria-label="Zoom">
          <button class="btn sm" data-act="zoom" data-d="-1" aria-label="Zoom out">−</button>
          <span class="mono zoomv">${Math.round(t.zoom * 100)}%</span>
          <button class="btn sm" data-act="zoom" data-d="1" aria-label="Zoom in">+</button>
          <button class="btn sm" data-act="zoomfit">Fit</button>
        </div>
        <button class="btn sm" data-act="expandall">Expand all</button>
        <button class="btn sm" data-act="collapseall">Collapse</button>
      </div>
      ${focusBar()}
      <div class="orgstage">
        <div class="orgscroll" id="orgscroll" data-act="orgpan">${treeSVG()}</div>
        <div class="hovercard" id="hovercard" hidden></div>
        ${UI.tree.selected ? `<aside class="orgpanel">${treeDetail()}</aside>` : ""}
        <div class="orglegend">${legend}<span><i class="ooo-dot"></i>Away</span></div>
      </div>`;
  }

  function focusBar() {
    const focused = UI.tree.root ? person(UI.tree.root) : null;
    const matches = searchMatches(UI.tree.search);
    const others = matches.filter(p => !focused || p.id !== focused.id).slice(0, 5);

    if (!focused) {
      if (!matches.length) return "";
      return `<div class="focusbar">
        <span class="fb-label">${matches.length} match${matches.length === 1 ? "" : "es"}</span>
        <div class="chips">${others.map(p => `<button class="chip sm" data-act="focusperson"
          data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div></div>`;
    }

    const mgr = focused.manager_id ? person(focused.manager_id) : null;
    const above = E.pathToRoot(S, focused.id).length - 1;
    return `<div class="focusbar on">
      <span class="fb-label">Showing ${esc(focused.name)}${
        focused.manager_id ? ` and their team only` : ``}</span>
      ${mgr ? `<button class="btn sm" data-act="focusup" data-id="${mgr.id}">
        ↑ Up to ${esc(mgr.name)}</button>` : ""}
      ${above ? `<span class="muted">${above} level${above === 1 ? "" : "s"} hidden above</span>` : ""}
      <button class="btn sm" data-act="focusclear">Show whole firm</button>
      ${others.length ? `<span class="muted">Other matches:</span>
        <div class="chips">${others.map(p => `<button class="chip sm" data-act="focusperson"
          data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>` : ""}
    </div>`;
  }

  function teamsPanel() {
    const teams = E.teamSummary(S);
    const at = now();
    return `<div class="stack">${teams.map(t => {
      const members = S.people.filter(p => E.departmentName(S, p) === t.department)
        .sort((a, b) => a.name.localeCompare(b.name));
      const owned = S.responsibilities.filter(r => r.role === "owner" &&
        members.some(m => m.id === r.person_id)).length;
      const load = S.requests.filter(r => E.OPEN_STATUSES.includes(r.status) &&
        members.some(m => m.id === r.assignee_id)).length;
      return `<div class="card">
        <div class="card-t"><span class="swatch" style="background:${deptColor(t.department)}"></span>
          ${esc(t.department)}</div>
        <div class="card-m"><span>Led by ${esc(t.head || "—")}</span>
          <span>${t.size} people</span>
          ${badge(owned + " processes owned", "role")}
          ${badge(load + " open requests", load ? "gold" : "mute")}
          ${t.ooo ? badge(t.ooo + " away", "ooo") : ""}</div>
        <div class="chips tight">${members.map(m =>
          `<button class="chip sm" data-act="treeperson" data-id="${m.id}">${esc(m.name)}</button>`
        ).join("")}</div>
        ${coversLine(t.department)}
      </div>`;
    }).join("")}</div>`;
  }

  // What Atlas will route to this team from a plain-English question. Showing
  // it makes the routing inspectable — and makes clear it is editable data,
  // not something the chat invented.
  function coversLine(name) {
    const dept = S.departments.find(d => d.name === name);
    const words = String(dept && dept.topics || "").split(",")
      .map(w => w.trim()).filter(Boolean);
    if (!words.length) return "";
    return `<details class="why"><summary>Covers ${words.length} topics</summary>
      <p class="sub small">${esc(words.join(" · "))}</p></details>`;
  }

  function deptOptions(selected) {
    const names = ["All departments"].concat(S.departments.map(d => d.name).sort());
    return names.map(n => `<option${n === selected ? " selected" : ""}>${esc(n)}</option>`).join("");
  }

  function pageProcesses() {
    if (UI.process) return processProfile(UI.process);
    return phead("Catalogue", "What you can ask for",
      "Ask for any of these in plain English.") + processList();
  }

  function processList() {
    const at = now();
    const cards = S.processes.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => {
      const owners = E.holders(S, p.id, "owner");
      const dels = E.holders(S, p.id, "delegate");
      const open = S.requests.filter(r => r.process_id === p.id &&
        E.OPEN_STATUSES.includes(r.status)).length;
      const ownerBadge = owners.length
        ? badge("Owner: " + owners[0].name, E.isOutOfOffice(owners[0], at) ? "ooo" : "role")
        : badge("Orphan — no owner", "escalated");
      return `<div class="rowline"><div class="card${owners.length ? "" : " alarm"}">
        <div class="card-t">${esc(p.name)}</div>
        <div class="card-m"><span>${esc(p.category)}</span></div>
        <div class="card-m" style="margin-top:7px">${ownerBadge}
          ${dels.length ? badge("Delegate: " + dels[0].name, "mute") : ""}
          ${badge(open + " open", open ? "gold" : "mute")}</div>
      </div><button class="btn sm" data-act="process" data-id="${p.id}">View</button></div>`;
    }).join("");
    return `<div class="stack">${cards}</div>`;
  }

  function processProfile(id) {
    const p = E.process_(S, id);
    if (!p) { UI.process = null; return pagePeople(); }
    const at = now();
    const stats = E.processStats(S, id);
    const orphan = !E.holders(S, id, "owner").length;
    const recent = S.requests.filter(r => r.process_id === id)
      .sort((a, b) => b.created_at - a.created_at).slice(0, 8);
    const roleRows = ["owner", "approver", "delegate", "backup"].map(role => {
      const list = E.holders(S, id, role);
      if (!list.length) return `<div class="kv"><span class="k">${esc(role[0].toUpperCase() +
        role.slice(1))}</span><span class="muted">not configured</span></div>`;
      return `<div class="kv"><span class="k">${esc(role[0].toUpperCase() + role.slice(1))}</span>
        <span class="chips">${list.map(x => badge(x.name + (E.isOutOfOffice(x, at) ? " · OOO" : ""),
          E.isOutOfOffice(x, at) ? "ooo" : "role")).join(" ")}</span></div>`;
    }).join("");
    return `<button class="btn sm" data-act="backdir">← Back to processes</button>
      <div class="card ${orphan ? "alarm" : "flag"}" style="margin-top:13px">
        <div class="card-t">${esc(p.name)} ${orphan ? badge("Orphan — no owner", "escalated") : ""}</div>
        <div class="card-m"><span>${esc(p.category)}</span></div>
        <div class="card-b">${esc(p.description)}</div>
      </div>
      <div class="tiles" style="margin-top:16px">
        ${tile("Requests", String(stats.total), "all time")}
        ${tile("Open now", String(stats.open), "in the queue", stats.open ? "warn" : "")}
        ${tile("Completed", String(stats.completed), "all time")}
        ${tile("Avg turnaround", stats.avg_turnaround_hours !== null ?
               Math.round(stats.avg_turnaround_hours) + "h" : "—", "raised to completed")}
      </div>
      <div class="grid2">
        <div><h2>Who is accountable</h2>
          ${orphan ? `<div class="note bad" style="margin:9px 0">Nobody owns this process.
            Requests matched to it are parked for the Atlas admin.</div>` : ""}
          <div style="margin-top:9px">${roleRows}</div>
          <h2 style="margin-top:20px">Matching keywords</h2>
          <div class="chips" style="margin-top:9px">${
            E.keywordList(p).map(k => badge(k, "mute")).join(" ") || `<span class="muted">none</span>`}</div>
        </div>
        <div><h2>Recent requests</h2><div class="stack" style="margin-top:9px">${
          recent.length ? recent.map(r => `<div class="card">
            <div class="card-t">#${r.id} — ${esc(r.title)}</div>
            <div class="card-m">${statusBadge(r.status)}
              <span>with ${esc(r.assignee_id ? person(r.assignee_id).name : "Unassigned")}</span>
              <span class="mono">${esc(human(now() - r.created_at))} old</span></div></div>`).join("")
            : empty("No requests have used this process yet.")}</div></div>
      </div>`;
  }

  /* ============================== requests ============================== */

  function requestRow(r, counterpartId, label) {
    const proc = r.process_id ? E.process_(S, r.process_id) : null;
    const cp = counterpartId ? person(counterpartId) : null;
    const unread = S.messages.filter(m => m.request_id === r.id && !m.read &&
      m.recipient_id === UI.actor).length;
    const chase = r.chase_count ? ` · ${r.chase_count} chase${r.chase_count === 1 ? "" : "s"}` : "";
    return `<div class="rowline">
      <div class="card ${r.status === "escalated" ? "alarm" : (r.status === "pending" ? "flag" : "")}">
        <div class="card-t">#${r.id} — ${esc(r.title)}</div>
        <div class="card-m">${statusBadge(r.status)}
          <span>${esc(proc ? proc.name : "No set process")}</span>
          <span>${esc(label)} ${esc(cp ? cp.name : "—")}</span>
          <span class="mono">raised ${esc(human(now() - r.created_at))} ago · quiet for ${
            esc(human(now() - r.last_action_at))}${esc(chase)}</span></div>
      </div>
      <button class="btn sm" data-act="open" data-id="${r.id}">Open${unread ? ` (${unread})` : ""}</button>
    </div>`;
  }

  function pageRequests() {
    if (UI.open) return requestDetail(UI.open);
    const me = actor();
    const open = S.requests.filter(r => r.assignee_id === UI.actor && E.OPEN_STATUSES.includes(r.status))
      .sort((a, b) => b.last_action_at - a.last_action_at);
    const mine = S.requests.filter(r => r.requester_id === UI.actor)
      .sort((a, b) => b.created_at - a.created_at);
    const done = S.requests.filter(r => r.assignee_id === UI.actor && r.status === "completed")
      .sort((a, b) => b.last_action_at - a.last_action_at);
    const which = UI.tab.requests || "inbox";
    const rows = which === "inbox" ? open : which === "mine" ? mine : done;
    const label = which === "mine" ? "with" : "from";
    const cp = r => which === "mine" ? r.assignee_id : r.requester_id;

    const tabs = [["inbox", `My inbox (${open.length})`], ["mine", `My requests (${mine.length})`],
                  ["done", "Completed by me"]].map(([k, t]) =>
      `<button class="tab" role="tab" data-act="subtab" data-group="requests" data-k="${k}"
        aria-selected="${which === k}">${esc(t)}</button>`).join("");

    const caption = "";

    return phead("Requests", `${me.name}'s desk`,
      `${open.length} with you · ${mine.length} raised by you`) +
      `<div class="tabs" role="tablist">${tabs}</div>` +
      (rows.length ? `<div class="stack">${rows.map(r => requestRow(r, cp(r), label)).join("")}</div>`
        : empty("Nothing here."));
  }

  function requestDetail(id) {
    const r = E.request(S, id);
    if (!r) { UI.open = null; return pageRequests(); }
    E.markRead(S, UI.actor, id);
    const proc = r.process_id ? E.process_(S, r.process_id) : null;
    const a = r.assignee_id ? person(r.assignee_id) : null;
    const req = person(r.requester_id);
    const orig = r.original_assignee_id ? person(r.original_assignee_id) : null;
    const msgs = S.messages.filter(m => m.request_id === id)
      .sort((x, y) => x.created_at - y.created_at || x.id - y.id);
    const isAssignee = r.assignee_id === UI.actor;
    const isOpen = E.OPEN_STATUSES.includes(r.status);

    const actions = !isOpen
      ? `<div class="note info">This request is closed.</div>`
      : isAssignee ? `
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn" data-act="ack" data-id="${id}"${
            r.status === "pending" || r.status === "escalated" ? "" : " disabled"}>Acknowledge</button>
          <button class="btn" data-act="prog" data-id="${id}"${
            r.status === "in_progress" ? " disabled" : ""}>Mark in progress</button>
          <button class="btn primary" data-act="done" data-id="${id}">Complete</button>
        </div>
        <label class="lbl" style="margin-top:13px" for="note">Add a note (sent to the requester)</label>
        <div style="display:flex;gap:9px">
          <input id="note" class="field" data-act="note" value="${esc(UI.note || "")}">
          <button class="btn" data-act="sendnote" data-id="${id}">Send note</button>
        </div>`
      : `<p class="sub">Switch to <strong>${esc(a ? a.name : "the assignee")}</strong>
         to act on it.</p>`;

    return `<button class="btn sm" data-act="back">← Back to the list</button>
      <div class="card flag" style="margin-top:13px">
        <div class="card-t">#${r.id} — ${esc(r.title)}</div>
        <div class="card-m">${statusBadge(r.status)}<span>${esc(proc ? proc.name : "No set process")}</span>
          <span class="mono">raised ${esc(human(now() - r.created_at))} ago</span></div>
        <div class="card-b">${esc(r.body)}</div>
      </div>
      <div class="grid2" style="margin-top:20px">
        <div><h2>Timeline</h2><div style="margin-top:9px">${trail(timelineOf(id))}</div></div>
        <div>
          <h2>Detail</h2>
          <div style="margin-top:9px">
            <div class="kv"><span class="k">Requester</span>${esc(req ? req.name : "—")}</div>
            <div class="kv"><span class="k">Assignee</span>${esc(a ? a.name : "Unassigned")}</div>
            ${orig && a && orig.id !== a.id ? `<div class="kv"><span class="k">Originally</span>
              ${esc(orig.name)} ${badge("rerouted", "gold")}</div>` : ""}
            <div class="kv"><span class="k">Raised</span><span class="mono">${esc(fmtTime(r.created_at))}</span></div>
            <div class="kv"><span class="k">Acknowledged</span><span class="mono">${esc(fmtTime(r.acknowledged_at))}</span></div>
            <div class="kv"><span class="k">Completed</span><span class="mono">${esc(fmtTime(r.completed_at))}</span></div>
            <div class="kv"><span class="k">Chases sent</span><span class="mono">${r.chase_count}</span></div>
          </div>
          <h2 style="margin-top:20px">Messages</h2>
          <div class="stack" style="margin-top:9px">${msgs.map(m => `<div class="card">
            <div class="card-m">${badge(m.type.replace(/_/g, " "), "role")}
              <span>${esc(m.sender_id ? person(m.sender_id).name : "Atlas agent")} →
                ${esc(person(m.recipient_id) ? person(m.recipient_id).name : "—")}</span>
              <span class="mono">${esc(fmtTime(m.created_at))}</span></div>
            <div class="card-b">${esc(m.body)}</div></div>`).join("")}</div>
        </div>
      </div>
      <div class="sect"><h2>Actions</h2></div>${actions}`;
  }

  /* =============================== agent log ============================ */

  const LOG_FILTERS = {
    "Autonomous actions": ["chase","escalation","escalation_blocked","reroute_ooo","reroute_chase","ooo_no_cover"],
    "Chases": ["chase"],
    "Reroutes": ["reroute","reroute_ooo","reroute_chase"],
    "Escalations": ["escalation","escalation_blocked"],
    "Routing decisions": ["routing","dispatch","orphan"],
    "Everything": null,
  };

  function pageAgentLog() {
    const at = now();
    const counts = {
      chase: S.events.filter(e => e.type === "chase").length,
      reroute: S.events.filter(e => e.type === "reroute_ooo" || e.type === "reroute_chase").length,
      esc: S.events.filter(e => e.type === "escalation").length,
    };
    const types = LOG_FILTERS[UI.filter] || null;
    const rows = S.events.filter(e => !types || types.includes(e.type))
      .sort((a, b) => b.created_at - a.created_at || b.id - a.id).slice(0, 200);

    const cards = rows.map(e => {
      const r = e.request_id ? E.request(S, e.request_id) : null;
      const tone = e.type.indexOf("escalation") === 0 ? "escalated"
        : (AGENT_TYPES.has(e.type) ? "gold" : "mute");
      const label = EVENT_LABELS[e.type] ||
        e.type.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
      return `<div class="card${e.type.indexOf("escalation") === 0 ? " alarm" : ""}">
        <div class="card-m">${badge(label, tone)}
          <span class="mono">${esc(fmtTime(e.created_at))} · ${esc(human(at - e.created_at))} ago</span>
          <strong>${esc(e.actor)}</strong>
          <span>${esc(r ? "#" + r.id + " — " + r.title : "no request")}</span></div>
        <div class="card-b">${esc(e.detail)}</div></div>`;
    }).join("");

    const opts = Object.keys(LOG_FILTERS).map(k =>
      `<option${k === UI.filter ? " selected" : ""}>${esc(k)}</option>`).join("");

    return phead("Agent", "What the agent did", "Nobody triggered any of this.") +
      `<div class="tiles">
        ${tile("Chases sent", String(counts.chase), "after 48h")}
        ${tile("Reroutes", String(counts.reroute), "to a cover")}
        ${tile("Escalations", String(counts.esc), "to a manager", counts.esc ? "bad" : "")}
      </div>
      <div class="toolbar">
        <div class="grow"><label class="lbl" for="lf">Show</label>
          <select id="lf" class="field" data-act="logfilter">${opts}</select></div>
        <button class="btn" data-act="tick">Run the agent now</button>
      </div>
      <p class="muted" style="margin-bottom:9px">${rows.length} entries</p>` +
      (rows.length ? `<div class="stack">${cards}</div>`
        : empty("Nothing yet.", "Move the clock forward in Demo controls."));
  }

  /* ================================ charts ============================== */
  /* Hand-built inline SVG: thin marks, rounded data-ends on the baseline,
     recessive grid, selective direct labels, hover tooltip on every mark. */

  const CH = { w: 560, rowH: 30, gap: 9, pad: { l: 124, r: 54, t: 8, b: 26 } };

  // Department names are long; the axis has a fixed gutter, so trim to fit.
  const SHORT = { "Investments / Deal Team": "Investments", "Legal & Compliance": "Legal & Comp.",
                  "Operations / HR": "Operations" };
  const shortLabel = s => SHORT[s] || s;
  const tipAttr = (title, body) =>
    `data-tip="${esc(title)}" data-tipb="${esc(body)}" tabindex="0"`;

  function barTrack(x, y, w, h) {
    return `<rect x="${x}" y="${y}" width="${Math.max(w, 0)}" height="${h}" rx="4" ry="4"
      class="bar" />`;
  }

  // Horizontal category bars, one series. Identity comes from the axis label,
  // so colour is not carrying meaning; escalated is tinted as a status.
  function hbar(rows, opts) {
    opts = opts || {};
    const max = Math.max(1, ...rows.map(r => r.value));
    const h = CH.pad.t + rows.length * (CH.rowH + CH.gap) + CH.pad.b;
    const plotW = CH.w - CH.pad.l - CH.pad.r;
    const ticks = niceTicks(max, 4);
    const grid = ticks.map(t => {
      const x = CH.pad.l + (t / max) * plotW;
      return `<line class="gl" x1="${x}" y1="${CH.pad.t}" x2="${x}" y2="${h - CH.pad.b}"/>
        <text class="axl" x="${x}" y="${h - CH.pad.b + 15}" text-anchor="middle">${t}</text>`;
    }).join("");
    const bars = rows.map((r, i) => {
      const y = CH.pad.t + i * (CH.rowH + CH.gap);
      const w = (r.value / max) * plotW;
      const fill = r.color || "var(--s1)";
      return `<g ${tipAttr(r.label, r.tip || (r.value + " requests"))}>
        <text class="cat" x="${CH.pad.l - 10}" y="${y + CH.rowH / 2 + 4}" text-anchor="end">${esc(shortLabel(r.label))}</text>
        <g fill="${fill}">${barTrack(CH.pad.l, y, w, CH.rowH)}</g>
        <text class="vl" x="${CH.pad.l + w + 7}" y="${y + CH.rowH / 2 + 4}">${r.value}</text>
      </g>`;
    }).join("");
    return `<svg viewBox="0 0 ${CH.w} ${h}" role="img" aria-label="${esc(opts.aria || "bar chart")}">
      ${grid}${bars}</svg>`;
  }

  // Two series, grouped. Legend + direct labels; validated colour pair.
  function groupedBar(rows, opts) {
    const pad = { l: 124, r: 66, t: 8, b: 26 };
    const barH = 13, inner = 5, groupH = barH * 2 + inner, gap = 14;
    const max = Math.max(1, ...rows.map(r => Math.max(r.a, r.b)));
    const h = pad.t + rows.length * (groupH + gap) + pad.b;
    const plotW = CH.w - pad.l - pad.r;
    const ticks = niceTicks(max, 4);
    const grid = ticks.map(t => {
      const x = pad.l + (t / max) * plotW;
      return `<line class="gl" x1="${x}" y1="${pad.t}" x2="${x}" y2="${h - pad.b}"/>
        <text class="axl" x="${x}" y="${h - pad.b + 15}" text-anchor="middle">${t}</text>`;
    }).join("");
    const bars = rows.map((r, i) => {
      const y = pad.t + i * (groupH + gap);
      const wa = (r.a / max) * plotW, wb = (r.b / max) * plotW;
      return `<g>
        <text class="cat" x="${pad.l - 10}" y="${y + groupH / 2 + 4}" text-anchor="end">${esc(shortLabel(r.label))}</text>
        <g fill="var(--s2)" ${tipAttr(r.label, opts.aLabel + ": " + r.a + "h")}>
          ${barTrack(pad.l, y, wa, barH)}</g>
        <text class="vl" x="${pad.l + wa + 6}" y="${y + barH - 2}">${r.a}h</text>
        <g fill="var(--s1)" ${tipAttr(r.label, opts.bLabel + ": " + r.b + "h")}>
          ${barTrack(pad.l, y + barH + inner, wb, barH)}</g>
        <text class="vl" x="${pad.l + wb + 6}" y="${y + barH + inner + barH - 2}">${r.b}h</text>
      </g>`;
    }).join("");
    return `<svg viewBox="0 0 ${CH.w} ${h}" role="img" aria-label="${esc(opts.aria || "grouped bar chart")}">
      ${grid}${bars}</svg>`;
  }

  function histogram(values, opts) {
    const pad = { l: 40, r: 14, t: 10, b: 34 };
    const w = CH.w, h = 210;
    if (!values.length) return "";
    const max = Math.max(...values), bins = 10;
    const size = Math.max(1, Math.ceil(max / bins));
    const counts = new Array(bins).fill(0);
    for (const v of values) counts[Math.min(bins - 1, Math.floor(v / size))]++;
    const top = Math.max(1, ...counts);
    const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
    const bw = plotW / bins;
    const ticks = niceTicks(top, 3);
    const grid = ticks.map(t => {
      const y = pad.t + plotH - (t / top) * plotH;
      return `<line class="gl" x1="${pad.l}" y1="${y}" x2="${w - pad.r}" y2="${y}"/>
        <text class="axl" x="${pad.l - 7}" y="${y + 4}" text-anchor="end">${t}</text>`;
    }).join("");
    const bars = counts.map((c, i) => {
      const bh = (c / top) * plotH;
      const x = pad.l + i * bw + 2, y = pad.t + plotH - bh;
      const lo = i * size, hi = (i + 1) * size;
      return `<g fill="var(--s1)" ${tipAttr(`${lo}–${hi}h old`,
        `${c} open request${c === 1 ? "" : "s"}`)}>
        ${barTrack(x, y, Math.max(bw - 4, 1), Math.max(bh, c ? 3 : 0))}</g>`;
    }).join("");
    const labels = [0, Math.floor(bins / 2), bins].map(i => {
      const x = pad.l + i * bw;
      return `<text class="axl" x="${x}" y="${h - 12}" text-anchor="middle">${i * size}h</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.aria || "histogram")}">
      ${grid}${bars}${labels}</svg>`;
  }

  function niceTicks(max, count) {
    const raw = max / count;
    const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
    const out = [];
    for (let v = 0; v <= max + 1e-9; v += step) out.push(Math.round(v * 10) / 10);
    if (out[out.length - 1] < max) out.push(Math.round((out[out.length - 1] + step) * 10) / 10);
    return out;
  }

  // Backup is distinguished by a dash pattern, not by a paler colour: a fourth
  // hue would not clear the CVD gate, and a near-surface grey is invisible.
  /* =============================== dashboard ============================ */

  function pageDashboard() {
    const at = now();
    const h = E.headline(S);
    const status = E.byStatus(S);
    const depts = E.openByDepartment(S);
    const turn = E.turnaroundByDepartment(S);
    const orphans = E.orphanProcesses(S);
    const spofs = E.singlePointsOfFailure(S, 2);
    const necks = E.bottlenecks(S);
    const ages = E.queueAges(S);

    const statusRows = status.map(r => ({
      label: r.status, value: r.count,
      color: r.key === "escalated" ? "var(--critical)" : "var(--s1)",
      tip: r.count + " request" + (r.count === 1 ? "" : "s"),
    }));
    const deptRows = depts.map(d => ({
      label: d.department, value: d.count,
      tip: d.count + " open" + (d.escalated ? ` · ${d.escalated} escalated` : ""),
    }));
    const turnRows = turn.map(t => ({ label: t.department, a: t.avg_ack_hours, b: t.avg_complete_hours }));

    const charts = `<div class="charts">
      <div class="chart"><h3>Requests by status</h3>
        ${hbar(statusRows, { aria: "Requests by status" })}</div>
      <div class="chart"><h3>Open by department</h3>
        ${deptRows.length ? hbar(deptRows, { aria: "Open requests by department" })
          : empty("Nothing open right now.")}</div>
      <div class="chart"><h3>Turnaround by department</h3>
        <div class="legend"><span><i style="background:var(--s2)"></i>Time to acknowledge</span>
          <span><i style="background:var(--s1)"></i>Time to complete</span></div>
        ${turnRows.length ? groupedBar(turnRows, { aLabel: "Time to acknowledge",
          bLabel: "Time to complete", aria: "Turnaround by department" })
          : empty("No completed requests yet.")}</div>
      <div class="chart"><h3>How long things have waited</h3>
        ${ages.length ? histogram(ages.map(a => a.age_hours), { aria: "Queue age distribution" })
          : empty("Nothing is waiting.")}</div>
    </div>`;

    const neckTable = necks.length ? `<div class="tblwrap"><table>
      <thead><tr><th>Person</th><th>Title</th><th>Department</th><th class="n">Open</th>
        <th class="n">Avg wait</th><th class="n">Oldest</th><th>Status</th></tr></thead>
      <tbody>${necks.map(b => `<tr><td><strong>${esc(b.person)}</strong></td><td>${esc(b.title)}</td>
        <td>${esc(b.department)}</td><td class="n">${b.open}</td>
        <td class="n">${b.avg_wait_hours}h</td><td class="n">${b.oldest_wait_hours}h</td>
        <td>${b.is_ooo ? badge("Out of office", "ooo") : `<span class="muted">In office</span>`}</td>
        </tr>`).join("")}</tbody></table></div>` : empty("No queues are backing up.");

    const orphanCards = orphans.length ? orphans.map(o => `<div class="card alarm">
        <div class="card-t">${esc(o.process)} ${badge("No owner", "escalated")}</div>
        <div class="card-m"><span>${esc(o.category)}</span>
          <span>${o.open_requests} open request(s)</span>
          <span>other roles configured: ${esc(o.other_roles)}</span></div></div>`).join("")
      : `<div class="note info">Every process has an owner.</div>`;

    const spofCards = spofs.length ? spofs.map(r => {
      const detail = r.uncovered.length ? "Uncovered: " + r.uncovered.join(", ")
        : r.owns ? "Every process they own has a delegate or backup."
        : `Approves on ${r.approves} process(es) but owns none outright.`;
      return `<div class="card${r.uncovered.length ? " alarm" : ""}">
        <div class="card-t">${esc(r.person)}</div>
        <div class="card-m"><span>${esc(r.title)}</span><span>${esc(r.department)}</span></div>
        <div class="card-m" style="margin-top:7px">${badge(r.owns + " owned", "role")}
          ${badge(r.approves + " approved", "role")}
          ${badge(r.open_load + " open", r.open_load ? "gold" : "mute")}
          ${r.is_ooo ? badge("Out of office", "ooo") : ""}
          ${r.uncovered.length ? badge(r.uncovered.length + " uncovered", "escalated") : ""}</div>
        <div class="card-b">${esc(detail)}</div></div>`;
    }).join("") : `<div class="note info">No individual carries enough uncovered processes
      to be a concern.</div>`;

    return phead("Dashboard", "Where work is stuck", "") + `
      <div class="tiles">
        ${tile("Open", String(h.open_requests), "of " + h.total_requests)}
        ${tile("To acknowledge", h.avg_ack_hours.toFixed(1) + "h", "average")}

               h.escalated_requests + " requests", h.escalation_rate >= 20 ? "bad" : "")}

               h.oldest_open_hours >= 48 ? "warn" : "")}

  /* ============================ event wiring ============================ */

  function captureDraft() {
    const t = document.querySelector('[data-act="dtitle"]');
    const b = document.querySelector('[data-act="dbody"]');
    if (UI.draft && t) UI.draft.title = t.value;
    if (UI.draft && b) UI.draft.body = b.value;
  }

  function sendDraft() {
    captureDraft();
    if (!UI.draft) return;
    const { query, processId, title, body } = UI.draft;
    const proc = E.process_(S, processId);
    const res = E.resolve(S, proc);
    const r = E.createRequest(S, {
      requester_id: UI.actor, process_id: processId, assignee_id: res.assignee_id,
      title, body, resolution: res,
    });
    UI.draft = null;
    pushMsg("bot", "sent", { id: r.id });
  }

  // Re-root the chart on someone and open on them at a readable size.
  function focusOn(personId) {
    UI.page = "people"; UI.tab.people = "org"; UI.process = null;
    UI.tree.root = personId;
    UI.tree.selected = personId;
    delete UI.tree.collapsed[personId];      // show their team, not a "+n" stub
    UI.tree.zoom = 1;
    UI.tree.center = false;
    UI.tree.focus = personId;
  }

  function expandTo(personId) {
    for (const id of E.pathToRoot(S, personId)) delete UI.tree.collapsed[id];
    UI.tree.selected = personId;
  }

  function collapseToTeams() {
    UI.tree.collapsed = {};
    const roots = E.orgTree(S);
    const walk = (n, depth) => {
      if (depth >= 1 && n.children.length) UI.tree.collapsed[n.id] = true;
      n.children.forEach(c => walk(c, depth + 1));
    };
    roots.forEach(r => walk(r, 0));
  }

  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    const id = el.dataset.id ? Number(el.dataset.id) : null;

    switch (act) {
      case "page": UI.page = el.dataset.page; UI.open = UI.person = UI.process = null;
        UI.moreOpen = false; return commit();
      case "moretoggle": UI.moreOpen = !UI.moreOpen; return commit();
      case "subtab": UI.tab[el.dataset.group] = el.dataset.k;
        UI.person = UI.process = null; return commit();

      /* rail */
      case "adv": {
        E.advance(S, Number(el.dataset.h));
        const n = E.runUntilSettled(S);
        return commit(`Advanced ${el.dataset.h}h. The agent took ${n} action${n === 1 ? "" : "s"}.`);
      }
      case "advcustom": {
        const hrs = Math.max(1, Math.min(720, Number(UI.advH || 24)));
        E.advance(S, hrs);
        const n = E.runUntilSettled(S);
        return commit(`Advanced ${hrs}h. The agent took ${n} action${n === 1 ? "" : "s"}.`);
      }
      case "clockreset": E.resetClock(S); return commit("Simulated clock reset to real time.");
      case "ooo": {
        const target = person(UI.oooPerson) ||
          S.people.slice().sort((a, b) => a.name.localeCompare(b.name))[0];
        const isOoo = E.isOutOfOffice(target, now());
        const days = Math.max(1, Math.min(60, Number(UI.oooDays || 5)));
        E.setOoo(S, target.id, !isOoo, isOoo ? null : now() + days * 24 * HOUR);
        const n = E.runUntilSettled(S);
        return commit(`${target.name} is now ${isOoo ? "back in the office" : "out of office"}. ` +
          `The agent took ${n} action${n === 1 ? "" : "s"}.`);
      }
      case "tick": {
        const n = E.runUntilSettled(S);
        return commit(`Agent evaluated its rules and took ${n} action${n === 1 ? "" : "s"}.`);
      }
      case "reseed": reseed(true); return commit("Database reset and reseeded.");

      /* guide */
      case "guide": UI.guideOpen = true; UI.guideStep = 0; return commit();
      case "guidenext": UI.guideStep = Math.min(TOUR.length - 1, UI.guideStep + 1); return commit();
      case "guideprev": UI.guideStep = Math.max(0, UI.guideStep - 1); return commit();
      case "guideclose": case "guideclose-bg":
        if (act === "guideclose-bg" && ev.target !== el) return;
        UI.guideOpen = false; UI.guideSeen = true; return commit();
      case "guidetry":
        UI.guideOpen = false; UI.guideSeen = true; UI.page = "chat";
        // A worked example, not a live send: the trace and the editable draft
        // are the point, and nobody wants a tour button to fire a real request.
        submitChat("I need access to the data room for Project Falcon");
        return commit();

      /* chat */
      case "say": UI.page = "chat"; submitChat(el.dataset.text); return commit();
      case "askperson": {
        UI.page = "chat"; UI.draft = null; hideHover();
        const who = person(id);
        if (who) pushMsg("user", "text", { text: `I need something from ${who.name}.` });
        botAskWho(id);
        return commit();
      }
      case "askproc": {
        const proc = E.process_(S, id);
        if (!proc) return;
        pushMsg("user", "text", { text: proc.name });
        openDraft(`I need ${proc.name.toLowerCase()}`, proc.id);
        return commit();
      }
      case "sendcontact":
        sendToContact(el.dataset.q, id);
        return commit();
      case "chose":
        commitChoice(el.dataset.q, id);
        return commit();
      case "undo": {
        if (!E.withdrawRequest(S, id, UI.actor)) {
          pushMsg("bot", "text", { text:
            "Too late to pull that one back — it's already been picked up. Open it and add a note instead." });
          return commit();
        }
        const msg = UI.chat.find(m => m.id === Number(el.dataset.mid));
        if (msg) msg.data.withdrawn = true;
        if (UI.open === id) UI.open = null;
        return commit();
      }
      case "chatsend": sendDraft(); return commit();
      case "chatcancel": UI.draft = null;
        pushMsg("bot", "text", { text: "Dropped it. Tell me what you need instead." });
        return commit();
      case "repick": {
        if (!UI.draft) return;
        pushMsg("bot", "pick", { query: UI.draft.query, options: [] });
        return commit();
      }
      case "switchproc": {
        if (!UI.draft) return;
        openDraft(UI.draft.query, id);
        return commit();
      }
      case "follow": {
        E.followExisting(S, id, UI.actor);
        UI.draft = null;
        pushMsg("bot", "text", { text: `Done — you're following #${id} instead of raising a duplicate.` });
        pushMsg("bot", "sent", { id });
        return commit();
      }

      /* requests */
      case "open": UI.page = "requests"; UI.open = id; return commit();
      case "back": UI.open = null; return commit();
      case "ack": E.acknowledge(S, id, UI.actor); return commit("Acknowledged.");
      case "prog": E.startProgress(S, id, UI.actor); return commit("Moved to In progress.");
      case "done": E.complete(S, id, UI.actor, UI.note || ""); UI.note = "";
        return commit("Request completed.");
      case "sendnote": {
        const note = (UI.note || "").trim();
        if (!note) return;
        E.addNote(S, id, UI.actor, note); UI.note = "";
        return commit("Note sent.");
      }

      /* people & tree */
      case "process": UI.page = "people"; UI.tab.people = "processes"; UI.process = id;
        return commit();
      case "backdir": UI.process = null; return commit();
      case "treetoggle":
        if (UI.tree.collapsed[id]) delete UI.tree.collapsed[id];
        else UI.tree.collapsed[id] = true;
        return commit();
      case "treeselect": UI.tree.selected = id; return commit();
      case "treeclose": UI.tree.selected = null; return commit();
      case "treeperson":
        UI.page = "people"; UI.tab.people = "org"; UI.process = null;
        expandTo(id); UI.tree.focus = id;
        return commit();
      case "zoom": {
        const box = document.getElementById("orgscroll");
        if (!box) return;
        const step = Number(el.dataset.d) > 0 ? 1.15 : 1 / 1.15;
        zoomAt(UI.tree.zoom * step, box.clientWidth / 2, box.clientHeight / 2);
        return;
      }
      case "zoomfit": {
        const box = document.getElementById("orgscroll");
        const svg = document.getElementById("treesvg");
        if (box && svg) {
          UI.tree.zoom = fitZoom(box, svg);
          applyZoom();
          centreStage(box);
          saveSoon();
        }
        return;
      }
      case "pickperson": {
        const picked = person(id);
        if (picked) UI.tree.query = picked.name;
        closeSuggest(); focusOn(id); return commit();
      }
      case "focusperson": focusOn(id); return commit();
      case "focusup": focusOn(id); return commit();
      case "focusclear":
        UI.tree.root = null; UI.tree.query = ""; UI.tree.selected = null;
        UI.tree.center = true; UI.tree.zoom = 0.85;
        return commit();
      case "expandall": UI.tree.collapsed = {}; UI.tree.center = true; return commit();
      case "collapseall": collapseToTeams(); UI.tree.center = true; return commit();
      default: return;
    }
  });

  // Clicking anywhere off the menu closes it.
  document.addEventListener("click", ev => {
    if (!UI.moreOpen) return;
    if (ev.target.closest(".morewrap")) return;
    UI.moreOpen = false;
    const menu = document.querySelector(".moremenu");
    if (menu) menu.remove();
    const btn = document.querySelector('[data-act="moretoggle"]');
    if (btn) btn.setAttribute("aria-expanded", "false");

  });

  document.addEventListener("change", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    switch (el.dataset.act) {
      case "actor": UI.actor = Number(el.value); UI.open = null; return commit();
      case "oooperson": UI.oooPerson = Number(el.value); return commit();
      case "logfilter": UI.filter = el.value; return commit();
      case "dept": UI.dept = el.value; return commit();
      case "treedept": UI.tree.dept = el.value; return commit();
      case "pickproc": {
        if (!el.value) return;
        const mid = Number(el.dataset.mid);
        const msg = UI.chat.find(m => m.id === mid);

  document.addEventListener("input", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    switch (el.dataset.act) {
      case "dtitle": if (UI.draft) UI.draft.title = el.value; break;
      case "dbody": if (UI.draft) UI.draft.body = el.value; break;
      case "note": UI.note = el.value; break;
      case "advh": UI.advH = el.value; break;
      case "oood": UI.oooDays = el.value; break;
      case "composer": autoGrow(el); return;
      case "search": UI.search = el.value; debounceRender(el, 220); break;
      case "treequery": UI.tree.query = el.value; sugIndex = -1; renderSuggest(); return;
      default: return;
    }
    save();
  });

  let sugIndex = -1;

  function currentSuggestions() {
    const input = document.querySelector('[data-act="treequery"]');
    const q = input ? input.value.trim() : "";
    return q ? searchMatches(q).slice(0, 6) : [];
  }

  function renderSuggest() {
    const box = document.getElementById("suggestbox");
    const input = document.querySelector('[data-act="treequery"]');
    if (!box || !input) return;
    const matches = currentSuggestions();
    if (!matches.length) {
      box.hidden = true; box.innerHTML = "";
      input.setAttribute("aria-expanded", "false");
      return;
    }
    box.hidden = false;
    input.setAttribute("aria-expanded", "true");
    box.innerHTML = matches.map((p, i) => `
      <button class="sug${i === sugIndex ? " on" : ""}" role="option"
        aria-selected="${i === sugIndex}" data-act="pickperson" data-id="${p.id}">
        <span class="sug-n">${esc(p.name)}</span>
        <span class="sug-t">${esc(p.title)} · ${esc(E.departmentName(S, p))}</span>
      </button>`).join("");
  }

  function closeSuggest() {
    const box = document.getElementById("suggestbox");
    const input = document.querySelector('[data-act="treequery"]');
    sugIndex = -1;
    if (box) { box.hidden = true; box.innerHTML = ""; }
    if (input) input.setAttribute("aria-expanded", "false");
  }

  let debTimer = null;
  function debounceRender(el, ms) {
    clearTimeout(debTimer);
    const act = el.dataset.act, pos = el.selectionStart;
    debTimer = setTimeout(() => {
      save(); render();
      const again = document.querySelector(`[data-act="${act}"]`);
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    }, ms);
  }

  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 160) + "px";
  }

  document.addEventListener("submit", ev => {
    const form = ev.target.closest('[data-act="chatform"]');
    if (!form) return;
    ev.preventDefault();
    const box = form.querySelector('[data-act="composer"]');
    const text = box ? box.value : "";
    if (!String(text).trim()) return;
    if (box) box.value = "";
    submitChat(text);
    commit();
  });

  document.addEventListener("keydown", ev => {
    const combo = ev.target.closest('[data-act="treequery"]');
    if (!combo) return;
    const matches = currentSuggestions();
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      if (!matches.length) return;
      ev.preventDefault();
      const step = ev.key === "ArrowDown" ? 1 : -1;
      sugIndex = sugIndex < 0
        ? (step > 0 ? 0 : matches.length - 1)
        : (sugIndex + step + matches.length) % matches.length;
      renderSuggest();
      return;
    }
    if (ev.key === "Enter") {
      ev.preventDefault();
      const pick = matches[sugIndex >= 0 ? sugIndex : 0];
      if (pick) { UI.tree.query = pick.name; focusOn(pick.id); closeSuggest(); commit(); }
      return;
    }
    if (ev.key === "Escape") { ev.preventDefault(); closeSuggest(); }
  });

  // Enter sends, Shift+Enter makes a new line.
  document.addEventListener("keydown", ev => {
    const box = ev.target.closest('[data-act="composer"]');
    if (box && ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      const form = box.closest("form");
      if (form) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit"));
      return;
    }
    if (ev.key === "Escape" && UI.guideOpen) { UI.guideOpen = false; UI.guideSeen = true; commit(); }
    const node = ev.target.closest('[data-act="treeselect"], [data-act="treetoggle"]');
    if (node && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); node.click(); }
  });

  /* ------------------------------ pan & zoom ---------------------------- */

  const ZOOM_MIN = 0.3, ZOOM_MAX = 2;
  const clampZoom = z => Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));

  // Fit against the stage's content box, and against both axes: fitting the
  // width alone leaves a chart that is still taller than the stage.
  function fitZoom(box, svg) {
    const vb = svg.viewBox.baseVal;
    const css = getComputedStyle(box);
    const padX = parseFloat(css.paddingLeft) + parseFloat(css.paddingRight);
    const padY = parseFloat(css.paddingTop) + parseFloat(css.paddingBottom);
    const w = (box.clientWidth - padX) / (vb.width || 1);
    const h = (box.clientHeight - padY) / (vb.height || 1);
    return clampZoom(Math.floor(Math.min(w, h, ZOOM_MAX) * 100) / 100);
  }

  // Whatever the stage cannot fit gets centred, not pinned to a corner.
  function centreStage(box) {
    box.scrollLeft = Math.max(0, (box.scrollWidth - box.clientWidth) / 2);
    box.scrollTop = Math.max(0, (box.scrollHeight - box.clientHeight) / 2);
  }

  function applyZoom() {
    const svg = document.getElementById("treesvg");
    if (!svg || !svg.viewBox.baseVal) return;
    svg.style.width = Math.round(svg.viewBox.baseVal.width * UI.tree.zoom) + "px";
    svg.style.height = Math.round(svg.viewBox.baseVal.height * UI.tree.zoom) + "px";
    const label = document.querySelector(".zoomv");
    if (label) label.textContent = Math.round(UI.tree.zoom * 100) + "%";
  }

  // Zoom about a point so whatever is under the cursor stays under it.
  function zoomAt(next, px, py) {
    const box = document.getElementById("orgscroll");
    if (!box) return;
    const old = UI.tree.zoom;
    next = clampZoom(next);
    if (Math.abs(next - old) < 0.001) return;
    const cx = (box.scrollLeft + px) / old, cy = (box.scrollTop + py) / old;
    UI.tree.zoom = next;
    applyZoom();
    box.scrollLeft = cx * next - px;
    box.scrollTop = cy * next - py;
    saveSoon();
  }

  let saveTimer = null;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }

  function bindPan() {
    const box = document.getElementById("orgscroll");
    if (!box) return;
    let down = false, sx = 0, sy = 0, sl = 0, st2 = 0;
    box.addEventListener("pointerdown", ev => {
      if (ev.target.closest("[data-act]") !== box && ev.target.closest("g[data-act]")) return;
      down = true; sx = ev.clientX; sy = ev.clientY; sl = box.scrollLeft; st2 = box.scrollTop;
      box.classList.add("grabbing");
    });
    const stop = () => { down = false; box.classList.remove("grabbing"); };
    box.addEventListener("pointermove", ev => {
      if (!down) return;
      box.scrollLeft = sl - (ev.clientX - sx);
      box.scrollTop = st2 - (ev.clientY - sy);
    });
    box.addEventListener("pointerup", stop);
    box.addEventListener("pointerleave", stop);

    box.addEventListener("wheel", ev => {
      // The chart owns the wheel: this is a canvas, not a scrolling document.
      ev.preventDefault();
      const rect = box.getBoundingClientRect();
      const step = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
      zoomAt(UI.tree.zoom * step, ev.clientX - rect.left, ev.clientY - rect.top);
    }, { passive: false });
  }

  /* ---------------------------- org hover card --------------------------- */
  /* Details on demand rather than crammed into every node, plus the pattern of
     lighting up the chain of command from the hovered person to the top. */

  let hoverTimer = null, hideTimer = null, hoveredId = null;

  function chainHighlight(personId) {
    const stage = document.getElementById("orgscroll");
    if (!stage) return;
    const chain = new Set(personId ? E.pathToRoot(S, personId) : []);
    stage.querySelectorAll(".onode").forEach(node => {
      const id = Number(node.dataset.node);
      node.classList.toggle("chain", chain.has(id));
      node.classList.toggle("faded", chain.size > 0 && !chain.has(id));
    });
  }

  function hoverCardHTML(p) {
    const at = now();
    const mgr = p.manager_id ? person(p.manager_id) : null;
    const reports = S.people.filter(x => x.manager_id === p.id).length;
    const owns = (E.responsibilitiesOf(S, p.id).owner || []).map(x => x.name);
    const load = S.requests.filter(r => r.assignee_id === p.id &&
      E.OPEN_STATUSES.includes(r.status)).length;
    const away = E.isOutOfOffice(p, at);
    return `<div class="hc-head">
        <span class="hc-av" style="--d:${deptColor(E.departmentName(S, p))}">${
          esc(initials(p.name))}</span>
        <span><strong>${esc(p.name)}</strong><br><span class="sub">${esc(p.title)}</span></span>
      </div>
      <div class="chips tight">${badge(E.departmentName(S, p), "role")}
        ${away ? badge("Away until " + E.fmtDate(p.ooo_until), "ooo") : ""}
        ${load ? badge(load + " open", "gold") : ""}</div>
      <div class="kv"><span class="k">Reports to</span>${esc(mgr ? mgr.name : "Nobody")}</div>
      ${reports ? `<div class="kv"><span class="k">Team</span>${reports} direct report${
        reports === 1 ? "" : "s"}</div>` : ""}
      <div class="kv"><span class="k">Owns</span>${owns.length
        ? esc(owns.join(", ")) : `<span class="muted">nothing directly</span>`}</div>
      <div class="acts">
        <button class="btn primary sm" data-act="askperson" data-id="${p.id}">Ask them for something</button>
        <button class="btn sm" data-act="focusperson" data-id="${p.id}">Their team</button>
      </div>`;
  }

  function showHover(nodeEl, personId) {
    const card = document.getElementById("hovercard");
    const stage = document.querySelector(".orgstage");
    const p = person(personId);
    if (!card || !stage || !p) return;
    card.innerHTML = hoverCardHTML(p);
    card.hidden = false;
    // Scale 1:1 with the chart, so the card is always the same size relative to
    // the cards it describes rather than dwarfing them when zoomed out.
    const z = UI.tree.zoom;
    card.style.transform = `scale(${z})`;
    const nb = nodeEl.getBoundingClientRect(), sb = stage.getBoundingClientRect();
    const cb = card.getBoundingClientRect();
    // Prefer below-right of the node, flip when that would leave the stage.
    let left = nb.left - sb.left + nb.width / 2 - cb.width / 2;
    let top = nb.bottom - sb.top + 10 * z;
    left = Math.max(8, Math.min(left, sb.width - cb.width - 8));
    if (top + cb.height > sb.height - 8) top = nb.top - sb.top - cb.height - 10;
    card.style.left = Math.round(left) + "px";
    card.style.top = Math.round(Math.max(8, top)) + "px";
  }

  function hideHover() {
    const card = document.getElementById("hovercard");
    if (card) { card.hidden = true; card.innerHTML = ""; }
    hoveredId = null;
    chainHighlight(null);
  }

  function bindHover() {
    const stage = document.getElementById("orgscroll");
    const card = document.getElementById("hovercard");
    if (!stage || !card) return;

    stage.querySelectorAll('g[data-act="treeselect"]').forEach(node => {
      const id = Number(node.dataset.id);
      const enter = () => {
        clearTimeout(hideTimer); clearTimeout(hoverTimer);
        if (hoveredId === id) return;
        hoverTimer = setTimeout(() => {
          hoveredId = id;
          chainHighlight(id);
          showHover(node, id);
        }, 220);
      };
      const leave = () => {
        clearTimeout(hoverTimer);
        hideTimer = setTimeout(hideHover, 220);
      };
      node.addEventListener("mouseenter", enter);
      node.addEventListener("mouseleave", leave);
      node.addEventListener("focus", () => { hoveredId = id; chainHighlight(id); showHover(node, id); });
      node.addEventListener("blur", leave);
    });

    // Moving into the card keeps it open so its buttons are clickable.
    card.addEventListener("mouseenter", () => clearTimeout(hideTimer));
    card.addEventListener("mouseleave", () => { hideTimer = setTimeout(hideHover, 180); });
    stage.addEventListener("scroll", hideHover, { passive: true });
  }

  /* ------------------------------ tooltips ------------------------------ */

  const tipEl = () => document.getElementById("tip");
  function showTip(target, ev) {
    const el = tipEl();
    el.innerHTML = `<div class="tt">${esc(target.dataset.tip)}</div>
      <div>${esc(target.dataset.tipb || "")}</div>`;
    el.hidden = false;
    const r = el.getBoundingClientRect();
    const x = Math.min(window.innerWidth - r.width - 10, (ev.clientX || 0) + 14);
    const y = Math.max(8, (ev.clientY || 0) - r.height - 12);
    el.style.left = x + "px"; el.style.top = y + "px";
  }
  function bindCharts() {
    document.querySelectorAll("[data-tip]").forEach(node => {
      node.addEventListener("mousemove", ev => showTip(node, ev));
      node.addEventListener("mouseleave", () => { tipEl().hidden = true; });
      node.addEventListener("focus", ev => {
        const b = node.getBoundingClientRect();
        showTip(node, { clientX: b.left + b.width / 2, clientY: b.top + b.height });
      });
      node.addEventListener("blur", () => { tipEl().hidden = true; });
    });
  }

  function afterRender() {
    bindCharts();
    bindPan();
    bindHover();
    if (UI.page === "chat") {
      const log = document.getElementById("chatlog");
      if (log) log.scrollTop = log.scrollHeight;
      const box = document.querySelector('[data-act="composer"]');
      if (box && !UI.guideOpen && !document.querySelector('[data-act="dbody"]:focus')) {
        box.focus(); autoGrow(box);
      }
    }
    if (UI.tree.center && UI.page === "people") {
      const box = document.getElementById("orgscroll");
      const svg = document.getElementById("treesvg");
      if (!box || !svg) {
        UI.tree.center = false;
      } else {
        const fit = fitZoom(box, svg);
        // Leave `center` set through the re-render. Clearing it here left the
        // chart correctly scaled and stuck against the left edge, because the
        // second pass never got to centre it.
        if (Math.abs(fit - UI.tree.zoom) > 0.02) { UI.tree.zoom = fit; save(); render(); return; }
        UI.tree.center = false;
        centreStage(box);
      }
    }
    if (UI.tree.focus) {
      const node = document.querySelector(`g[data-act="treeselect"][data-id="${UI.tree.focus}"]`);
      const box = document.getElementById("orgscroll");
      if (node && box) {
        const nb = node.getBoundingClientRect(), bb = box.getBoundingClientRect();
        box.scrollLeft += (nb.left - bb.left) - box.clientWidth / 2 + nb.width / 2;
        box.scrollTop += (nb.top - bb.top) - box.clientHeight / 2;
      }
      UI.tree.focus = null;
    }
  }

  /* -------------------------------- boot -------------------------------- */

  if (!load()) reseed(false);
  if (!E.person(S, UI.actor)) UI.actor = S.people[0].id;
  if (!UI.chat.length) greet();
  if (!UI.guideSeen) UI.guideOpen = true;
  render();

  setInterval(() => {
    const before = S.events.length;
    E.tick(S);
    if (S.events.length !== before) { save(); render(); } else { save(); }
  }, 2000);
})();

</script>
