<title>Atlas Responsibility Routing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --ground:#FBF8F0; --surface:#FFFFFF; --surface-2:#F5F0E3; --surface-3:#EDE6D4;
  --line:#E4DCC8; --line-soft:#F0EADB;
  --ink:#17241E; --ink-2:#55655C; --ink-3:#7C8A82;
  --gold:#B98B0A; --gold-ink:#8A6707; --gold-soft:#F6EFD6;
  --green:#0F8A5F; --green-deep:#123528; --green-soft:#E3F0E9;
  --critical:#C0392F; --critical-soft:#FAE7E4;
  --warn:#B4761C; --warn-soft:#FBF0DB;
  --rail:#0C2A21; --rail-2:#123528; --rail-ink:#EDE7D6; --rail-ink-2:#9FB3A8;
  --rail-line:rgba(237,231,214,.16); --rail-fill:rgba(237,231,214,.08);
  --s1:#0F8A5F;  /* chart series 1 - validated */
  --s2:#B98B0A;  /* chart series 2 - validated */
  /* Org-chart team stripes. These label a node, never encode a quantity, and
     every node also carries its team name as text. */
  --dept-b:#2A6FB0; --dept-c:#8A4FA8; --dept-d:#0E8C8C; --dept-e:#C4633A;
  --grid:#EDE6D4;
  --shadow:0 1px 2px rgba(18,53,40,.05), 0 8px 24px -18px rgba(18,53,40,.35);
  --r:10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#0D1A15; --surface:#14241D; --surface-2:#1B2F26; --surface-3:#22392F;
    --line:#263B31; --line-soft:#1E322A;
    --ink:#E9E4D6; --ink-2:#A9B8AE; --ink-3:#7E8F85;
    --gold:#B08E2A; --gold-ink:#DCC167; --gold-soft:#2C2718;
    --green:#25A075; --green-deep:#B7DCC9; --green-soft:#152E25;
    --critical:#E8756F; --critical-soft:#33201E;
    --warn:#D8A34B; --warn-soft:#2E2617;
    --rail:#091410; --rail-2:#0F1F19; --rail-ink:#E9E4D6; --rail-ink-2:#93A79B;
    --rail-line:rgba(233,228,214,.14); --rail-fill:rgba(233,228,214,.07);
    --s1:#25A075; --s2:#B08E2A;
    --dept-b:#5C9BD8; --dept-c:#B183CC; --dept-d:#3FB0B0; --dept-e:#DE8B63;
    --grid:#263B31;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] {
  --ground:#0D1A15; --surface:#14241D; --surface-2:#1B2F26; --surface-3:#22392F;
  --line:#263B31; --line-soft:#1E322A;
  --ink:#E9E4D6; --ink-2:#A9B8AE; --ink-3:#7E8F85;
  --gold:#B08E2A; --gold-ink:#DCC167; --gold-soft:#2C2718;
  --green:#25A075; --green-deep:#B7DCC9; --green-soft:#152E25;
  --critical:#E8756F; --critical-soft:#33201E;
  --warn:#D8A34B; --warn-soft:#2E2617;
  --rail:#091410; --rail-2:#0F1F19; --rail-ink:#E9E4D6; --rail-ink-2:#93A79B;
  --rail-line:rgba(233,228,214,.14); --rail-fill:rgba(233,228,214,.07);
  --s1:#25A075; --s2:#B08E2A;
  --dept-b:#5C9BD8; --dept-c:#B183CC; --dept-d:#3FB0B0; --dept-e:#DE8B63;
  --grid:#263B31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
}

/* ------------------------------------------------------------------ base */
*, *::before, *::after { box-sizing:border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 { margin:0; font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
  font-weight:600; letter-spacing:-.012em; text-wrap:balance; color:var(--ink); }
h1 { font-size:2.05rem; line-height:1.12; }
h2 { font-size:1.28rem; line-height:1.2; }
h3 { font-size:1.02rem; }
p { margin:0; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--gold-ink); }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
.mono { font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric:tabular-nums; }
.num { font-variant-numeric:tabular-nums; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ------------------------------------------------------------------ shell */
.app { display:grid; grid-template-columns:288px minmax(0,1fr); min-height:100vh; }
.rail { background:var(--rail); color:var(--rail-ink); padding:22px 20px 40px;
  border-right:1px solid var(--rail-line); display:flex; flex-direction:column; gap:20px; }
.canvas { min-width:0; padding:26px 30px 72px; }
.wrap { max-width:1120px; margin:0 auto; }
.wrap.wide { max-width:1500px; }
.app.chatmode .canvas { padding-bottom:0; }
@media (max-width:900px) {
  .app { grid-template-columns:minmax(0,1fr); }
  .rail { border-right:none; border-bottom:1px solid var(--rail-line); }
  .canvas { padding:20px 16px 60px; }
}

/* ------------------------------------------------------------- rail parts */
.brand { display:flex; align-items:center; gap:11px; }
.brand .mark { width:34px; height:34px; border-radius:9px; background:var(--gold);
  color:#12211A; display:grid; place-items:center; font-weight:700; font-size:1.05rem;
  font-family:"Source Serif 4", serif; flex:none; }
.brand .name { font-family:"Source Serif 4", serif; font-size:1.22rem; font-weight:600;
  letter-spacing:.02em; color:var(--rail-ink); line-height:1.1; }
.brand .tag { font-size:.66rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--rail-ink-2); }
.rail-sec { display:flex; flex-direction:column; gap:9px; }
.rail-sec + .rail-sec { border-top:1px solid var(--rail-line); padding-top:18px; }
.rail-label { font-size:.66rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--rail-ink-2); font-weight:600; }
.rail-note { font-size:.79rem; color:var(--rail-ink-2); line-height:1.45; }
.rail select, .rail input {
  width:100%; background:var(--rail-fill); color:var(--rail-ink);
  border:1px solid var(--rail-line); border-radius:8px; padding:8px 10px; font-size:.86rem;
}
.rail select { appearance:none; background-image:
  linear-gradient(45deg,transparent 50%,var(--rail-ink-2) 50%),
  linear-gradient(135deg,var(--rail-ink-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:28px; }
.rail select option { background:var(--rail-2); color:var(--rail-ink); }
.btn-row { display:flex; gap:6px; }
.rail button {
  background:var(--rail-fill); color:var(--rail-ink); border:1px solid var(--rail-line);
  border-radius:8px; padding:8px 10px; font-size:.84rem; font-weight:500; cursor:pointer;
  flex:1; transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.rail button:hover { background:var(--gold); border-color:var(--gold); color:#12211A; }
.rail button.danger:hover { background:var(--critical); border-color:var(--critical); color:#fff; }
.clock-read { font-size:.95rem; font-weight:500; }
.clock-off { font-size:.76rem; color:var(--rail-ink-2); }
.agent-dot { width:8px; height:8px; border-radius:50%; background:var(--gold);
  display:inline-block; margin-right:6px; }
@media (prefers-reduced-motion: no-preference) {
  .agent-dot.live { animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
}

/* -------------------------------------------------------------- nav tabs */
.tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line);
  margin-bottom:22px; }
.tab { background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
  padding:9px 14px; font-size:.9rem; font-weight:500; color:var(--ink-3); border-radius:6px 6px 0 0; }
.tab:hover { color:var(--ink); background:var(--surface-2); }
.tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--gold); font-weight:600; }

/* ------------------------------------------------------------ page header */
.phead { margin-bottom:22px; }
.eyebrow { font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold-ink); font-weight:600; margin-bottom:7px; }
.phead p { color:var(--ink-2); margin-top:7px; max-width:66ch; }

/* ------------------------------------------------------------------ cards */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px; box-shadow:var(--shadow); }
.card + .card { margin-top:9px; }
.card.flag { border-left:3px solid var(--gold); }
.card.alarm { border-left:3px solid var(--critical); }
.card-t { font-weight:600; font-size:.97rem; }
.card-m { color:var(--ink-2); font-size:.82rem; margin-top:3px;
  display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.card-b { margin-top:9px; font-size:.9rem; color:var(--ink-2); white-space:pre-wrap; }
.rowline { display:flex; gap:12px; align-items:center; }
.rowline > .card { flex:1; margin:0; }
.stack { display:flex; flex-direction:column; gap:9px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px; }
.charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(440px,1fr)); gap:18px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px;
  margin-bottom:26px; }

/* ------------------------------------------------------------------ tiles */
.tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 15px; box-shadow:var(--shadow); }
.tile .l { font-size:.66rem; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; }
.tile .v { font-family:"Source Serif 4",serif; font-size:1.85rem; font-weight:600;
  line-height:1.2; margin-top:4px; font-variant-numeric:tabular-nums; }
.tile .s { font-size:.78rem; color:var(--ink-3); }
.tile.warn { border-left:3px solid var(--warn); }
.tile.bad  { border-left:3px solid var(--critical); }
.tile.good { border-left:3px solid var(--green); }

/* ----------------------------------------------------------------- badges */
.b { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px;
  font-size:.71rem; font-weight:600; letter-spacing:.01em; border:1px solid transparent;
  white-space:nowrap; }
.b.pending{background:var(--warn-soft);color:var(--warn);border-color:currentColor}
.b.acknowledged{background:var(--green-soft);color:var(--green);border-color:currentColor}
.b.in_progress{background:var(--gold-soft);color:var(--gold-ink);border-color:currentColor}
.b.completed{background:var(--green-soft);color:var(--green);border-color:currentColor}
.b.escalated{background:var(--critical-soft);color:var(--critical);border-color:currentColor}
.b.ooo{background:var(--warn-soft);color:var(--warn);border-color:currentColor}
.b.role{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.b.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:currentColor}
.b.mute{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }

/* ------------------------------------------------- the audit-trail motif */
.trail { position:relative; margin:4px 0 4px 7px; padding-left:19px;
  border-left:1px solid var(--line); }
.trail .node { position:relative; padding:8px 0; }
.trail .node::before { content:""; position:absolute; left:-24px; top:14px; width:9px; height:9px;
  border-radius:50%; background:var(--ink-3); box-shadow:0 0 0 3px var(--surface); }
.trail .node.ok::before{background:var(--green)}
.trail .node.warn::before{background:var(--warn)}
.trail .node.fail::before{background:var(--critical)}
.trail .node.agent::before{background:var(--gold)}
.trail .k { font-weight:600; font-size:.86rem; }
.trail .d { font-size:.86rem; color:var(--ink-2); }
.trail .w { font-size:.72rem; color:var(--ink-3); letter-spacing:.02em; }
.trail .who { color:var(--gold-ink); font-weight:600; }

/* --------------------------------------------------------------- controls */
.btn { background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:8px 14px; font-size:.88rem; font-weight:500; cursor:pointer; color:var(--ink);
  transition:border-color .12s ease, background .12s ease; }
.btn:hover { border-color:var(--green); }
.btn.primary { background:var(--green-deep); border-color:var(--green-deep); color:#F5F0E3; }
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn.primary { background:var(--green); border-color:var(--green); color:#08150F; }
}
:root[data-theme="dark"] .btn.primary { background:var(--green); border-color:var(--green); color:#08150F; }
.btn.primary:hover { filter:brightness(1.08); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.sm { padding:5px 11px; font-size:.81rem; }
.btn.link { background:none; border:none; padding:0; color:var(--gold-ink);
  text-decoration:underline; text-underline-offset:3px; }
.field { width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:8px; padding:9px 11px; font-size:.9rem; }
textarea.field { resize:vertical; min-height:96px; font-family:inherit; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip { background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:6px 13px; font-size:.82rem; cursor:pointer; color:var(--ink-2); }
.chip:hover { border-color:var(--gold); color:var(--ink); }
.toolbar { display:flex; gap:9px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.toolbar .grow { flex:1; min-width:190px; }
label.lbl { display:block; font-size:.73rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; margin-bottom:5px; }

/* ------------------------------------------------------------------ misc */
.empty { border:1px dashed var(--line); border-radius:var(--r); padding:30px 20px;
  text-align:center; color:var(--ink-3); background:var(--surface); }
.empty .big { color:var(--ink); font-weight:600; margin-bottom:4px; }
.note { border-radius:8px; padding:10px 13px; font-size:.87rem; border:1px solid; }
.note.info { background:var(--green-soft); border-color:var(--green); color:var(--ink); }
.note.warn { background:var(--warn-soft); border-color:var(--warn); color:var(--ink); }
.note.bad  { background:var(--critical-soft); border-color:var(--critical); color:var(--ink); }
.kv { font-size:.87rem; padding:3px 0; display:flex; gap:10px; }
.kv .k { color:var(--ink-3); min-width:124px; flex:none; }
.sub { color:var(--ink-2); font-size:.87rem; }
.muted { color:var(--ink-3); font-size:.8rem; }
.sect { margin:26px 0 12px; display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; }
.sect p { color:var(--ink-2); font-size:.85rem; }
.tblwrap { overflow-x:auto; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); }
table { border-collapse:collapse; width:100%; font-size:.86rem; }
th { text-align:left; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:10px 13px; border-bottom:1px solid var(--line);
  white-space:nowrap; }
td { padding:9px 13px; border-bottom:1px solid var(--line-soft); }
tr:last-child td { border-bottom:none; }
td.n { text-align:right; font-variant-numeric:tabular-nums; }
.flash { position:fixed; right:18px; bottom:18px; z-index:40; max-width:340px;
  background:var(--green-deep); color:#F5F0E3; padding:11px 15px; border-radius:9px;
  font-size:.87rem; box-shadow:0 10px 30px -8px rgba(0,0,0,.45); }
@media (prefers-reduced-motion: no-preference) { .flash { animation:rise .22s ease-out; } }
@keyframes rise { from { transform:translateY(7px); opacity:0 } }

/* ----------------------------------------------------------------- charts */
.chart { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px 11px; box-shadow:var(--shadow); }
.chart h3 { font-family:"IBM Plex Sans",sans-serif; font-size:.92rem; font-weight:600; }
.chart .csub { font-size:.78rem; color:var(--ink-3); margin-top:2px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; margin:9px 0 3px; font-size:.79rem;
  color:var(--ink-2); }
.legend i { width:10px; height:10px; border-radius:3px; display:inline-block;
  margin-right:5px; vertical-align:-1px; }
.chart svg { display:block; width:100%; height:auto; overflow:visible; }
.chart .gl { stroke:var(--grid); stroke-width:1; }
.chart .axl { fill:var(--ink-3); font-size:11px; font-family:"IBM Plex Mono",monospace; }
.chart .vl { fill:var(--ink-2); font-size:11px; font-weight:600;
  font-family:"IBM Plex Mono",monospace; }
.chart .cat { fill:var(--ink-2); font-size:11.5px; }
.bar { transition:opacity .12s ease; }
.bar:hover { opacity:.78; }
.tip { position:fixed; z-index:50; pointer-events:none; background:var(--rail);
  color:var(--rail-ink); font-size:.79rem; padding:7px 10px; border-radius:7px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.5); max-width:250px; }
.tip .tt { font-weight:600; }
.gnode { cursor:default; }
.focusbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:11px 0 0;
  padding:9px 13px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface-2); font-size:.85rem; }
.focusbar.on { border-color:var(--gold); background:var(--gold-soft); }
.focusbar .fb-label { font-weight:600; }
.focusbar .chips { gap:5px; }

/* --------------------------------------------------- full-bleed org chart */
.app.orgmode .canvas { display:flex; flex-direction:column; height:100vh;
  padding:20px 24px 0; }
/* margin:0 auto on the cross axis beats align-items:stretch, so clear it. */
.app.orgmode .wrap { display:flex; flex-direction:column; flex:1; min-height:0;
  max-width:none; width:100%; margin:0; }
.app.orgmode #page { display:flex; flex-direction:column; flex:1; min-height:0; }
.app.orgmode .tabs { margin-bottom:14px; }

.orgtools { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:11px; }
.findwrap { position:relative; flex:1; min-width:230px; max-width:380px; }
.field.slim { width:auto; min-width:170px; padding:8px 11px; font-size:.86rem; }
.suggest-list { position:absolute; z-index:30; top:calc(100% + 5px); left:0; right:0;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.4); overflow:hidden; }
.sug { display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
  padding:9px 13px; border-bottom:1px solid var(--line-soft); }
.sug:last-child { border-bottom:none; }
.sug:hover, .sug.on { background:var(--gold-soft); }
.sug .sug-n { display:block; font-weight:600; font-size:.9rem; color:var(--ink); }
.sug .sug-t { display:block; font-size:.78rem; color:var(--ink-3); }

.orgstage { position:relative; flex:1; min-height:340px; margin-bottom:16px; }
.orgstage .orgscroll { height:100%; border-radius:var(--r); padding:26px;
  display:flex; justify-content:safe center; align-items:safe center; }
/* The chart is a flex item: without this it shrinks back to the container and
   zooming changes nothing but the label. */
.orgstage .orgscroll > svg { flex:none; }
.orgpanel { position:absolute; top:14px; right:14px; width:302px; z-index:12;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; box-shadow:0 14px 36px -14px rgba(0,0,0,.4); }
.orgpanel .kv { gap:8px; }
.orgpanel .kv .k { min-width:84px; }
.orglegend { position:absolute; left:14px; bottom:12px; z-index:11; display:flex; gap:11px;
  flex-wrap:wrap; font-size:.73rem; color:var(--ink-2); background:var(--surface);
  border:1px solid var(--line); border-radius:999px; padding:5px 13px; opacity:.94; }
.orglegend i { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:4px; }
.orglegend .ooo-dot { width:8px; height:8px; border-radius:50%; background:var(--warn);
  display:inline-block; margin-right:4px; }
@media (max-width:900px) {
  .app.orgmode .canvas { height:auto; }
  .orgstage { min-height:60vh; }
  .orgpanel { position:static; width:auto; margin-top:11px; }
}
</style>
<div id="root"></div>
<div id="tip" class="tip" hidden></div>

<style>
/* ------------------------------------------------------------------ chat */
.chatpage { display:flex; flex-direction:column; height:calc(100vh - 150px); min-height:440px; }
.chatlog { flex:1; overflow-y:auto; padding:4px 2px 16px; scroll-behavior:smooth; }
.msg { display:flex; gap:11px; margin-bottom:16px; max-width:760px; }
.msg.user { margin-left:auto; justify-content:flex-end; }
.msg.user .bub { background:var(--green-deep); color:#F3EEE0; border-radius:14px 14px 4px 14px;

    created:"Request raised", routing:"Routing", dispatch:"Dispatched", chase:"Chase sent",
    escalation:"Escalated", escalation_blocked:"Escalation blocked", reroute:"Reassigned",
    reroute_ooo:"Rerouted — out of office", reroute_chase:"Rerouted — no response",
    ooo_no_cover:"No cover available", acknowledged:"Acknowledged", status_update:"Status update",
    completed:"Completed", note:"Note", follow:"Follower joined", orphan:"No owner",
    ooo_change:"Out-of-office change", seed:"Database seeded",
  };
  const AGENT_TYPES = new Set(["chase","escalation","reroute_ooo","reroute_chase",
                               "ooo_no_cover","escalation_blocked"]);
  const ALERT_TYPES = new Set(["escalation","escalation_blocked","orphan"]);

  function trail(events) {
    if (!events.length) return empty("Nothing has happened yet.",
      "Events appear here as the request moves.");
    return `<div class="trail">` + events.map(e => {
      let cls = "node";
      if (ALERT_TYPES.has(e.type)) cls += " fail";
      else if (e.actor === E.AGENT_ACTOR || AGENT_TYPES.has(e.type)) cls += " agent";
      else cls += " ok";
      const label = EVENT_LABELS[e.type] ||
        e.type.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
      return `<div class="${cls}">
        <div class="w mono">${esc(fmtTime(e.created_at))} · <span class="who">${esc(e.actor)}</span></div>
        <div class="d"><span class="k">${esc(label)}</span> — ${esc(e.detail)}</div></div>`;
    }).join("") + `</div>`;
  }

  function timelineOf(id) {
    return S.events.filter(e => e.request_id === id)
      .sort((a, b) => a.created_at - b.created_at || a.id - b.id);
  }
  const unreadFor = id => S.messages.filter(m => m.recipient_id === id && !m.read).length;

  /* --------------------------------- rail ------------------------------- */

  function railHTML() {
    const at = now();
    const people = S.people.slice().sort((a, b) => a.name.localeCompare(b.name));
    const opt = p => `<option value="${p.id}"${p.id === UI.actor ? " selected" : ""}>` +
      `${esc(p.name)} — ${esc(p.title)}${E.isOutOfOffice(p, at) ? "  (OOO)" : ""}</option>`;
    const unread = unreadFor(UI.actor);
    const oooTarget = person(UI.oooPerson) || people[0];
    const oooOpt = p => `<option value="${p.id}"${p.id === oooTarget.id ? " selected" : ""}>` +
      `${esc(p.name)}${E.isOutOfOffice(p, at) ? "  (OOO)" : ""}</option>`;
    const isOoo = E.isOutOfOffice(oooTarget, at);

    return `
    <div class="brand"><span class="mark">A</span>
      <span><span class="name">ATLAS</span><br><span class="tag">Responsibility, routed</span></span></div>

    <div class="rail-sec">
      <span class="rail-label">You are</span>
      <select data-act="actor" aria-label="Acting as">${people.map(opt).join("")}</select>
      <span class="rail-note">${unread ? unread + " unread message" + (unread === 1 ? "" : "s") +
        " in your inbox." : "Inbox clear."}</span>
      <button data-act="guide">Open the guide</button>
    </div>

    <div class="rail-sec">
      <span class="rail-label">Demo controls</span>
      <span class="rail-note">None of this exists in a real deployment — it is how the
        prototype is driven.</span>
    </div>

    <div class="rail-sec">
      <span class="rail-label">Simulated clock</span>
      <span class="clock-read mono">${esc(fmtTime(at))}</span>
      <span class="clock-off mono">offset ${E.offsetHours(S) >= 0 ? "+" : ""}${E.offsetHours(S)}h from real time</span>
      <div class="btn-row">
        <button data-act="adv" data-h="1">+1h</button>
        <button data-act="adv" data-h="24">+24h</button>
        <button data-act="adv" data-h="48">+48h</button>
      </div>
      <label class="sr" for="advh">Advance by hours</label>
      <input id="advh" type="number" min="1" max="720" value="${UI.advH || 24}" data-act="advh">
      <button data-act="advcustom">Advance clock</button>
      <button data-act="clockreset">Reset clock to real time</button>
    </div>

    <div class="rail-sec">
      <span class="rail-label">Out of office</span>
      <select data-act="oooperson" aria-label="Person">${people.map(oooOpt).join("")}</select>
      <label class="sr" for="oood">Away for days</label>
      <input id="oood" type="number" min="1" max="60" value="${UI.oooDays || 5}" data-act="oood">
      <button data-act="ooo">${isOoo ? "Mark back in office" : "Mark out of office"}</button>
    </div>

    <div class="rail-sec">
      <span class="rail-label"><span class="agent-dot live"></span>Agent</span>
      <span class="rail-note">Evaluating its rules every 2s<br>
        last pass ${esc(S.lastTickAt ? fmtTime(S.lastTickAt) : "—")}</span>
      <button data-act="tick">Run agent now</button>
    </div>

    <div class="rail-sec">
      <span class="rail-label">Database</span>
      <button class="danger" data-act="reseed">Reset &amp; reseed</button>
    </div>`;
  }

  /* --------------------------------- shell ------------------------------ */

  const PAGES = [["chat", "Ask Atlas"], ["people", "People"], ["requests", "Requests"],
                 ["agentlog", "Agent Log"], ["dashboard", "Dashboard"], ["guide", "Guide"]];

  function render() {
    const root = document.getElementById("root");
    const tabs = PAGES.map(([k, label]) => {
      const extra = k === "requests" && unreadFor(UI.actor)
        ? ` <span class="pip">${unreadFor(UI.actor)}</span>` : "";
      return `<button class="tab" role="tab" data-act="page" data-page="${k}"
        aria-selected="${UI.page === k}">${esc(label)}${extra}</button>`;
    }).join("");

    const orgMode = UI.page === "people" && (UI.tab.people || "org") === "org";
    root.innerHTML = `<div class="app${UI.page === "chat" ? " chatmode" : ""}${
      orgMode ? " orgmode" : ""}">
      <aside class="rail">${railHTML()}</aside>
      <main class="canvas"><div class="wrap${UI.page === "people" ? " wide" : ""}">
        <div class="tabs" role="tablist">${tabs}</div>
        <div id="page">${pageHTML()}</div>
      </div></main></div>` +
      (UI.flash ? `<div class="flash">${esc(UI.flash)}</div>` : "") +
      (UI.guideOpen ? guideOverlay() : "");

    if (UI.flash) { const f = UI.flash; setTimeout(() => {
      if (UI.flash === f) { UI.flash = null; const el = document.querySelector(".flash");
        if (el) el.remove(); } }, 4200); }
    afterRender();
  }

  function pageHTML() {
    switch (UI.page) {
      case "people":    return pagePeople();
      case "requests":  return pageRequests();
      case "agentlog":  return pageAgentLog();
      case "dashboard": return pageDashboard();
      case "guide":     return pageGuide();
      default:          return pageChat();
    }
  }

  function flash(msg) { UI.flash = msg; }
  function commit(msg) { if (msg) flash(msg); save(); render(); }

  /* ================================= chat =============================== */

  const SUGGESTIONS = [
    "I need access to the data room for Project Falcon",
    "Who owns invoice approval?",
    "Is anyone out of office?",
    "What's in my inbox?",
  ];

  function pushMsg(role, kind, data) {
    UI.chat.push({ id: UI.msgSeq++, role, kind, data: data || {}, at: now() });
    if (UI.chat.length > 200) UI.chat.splice(0, UI.chat.length - 200);
  }

  function greet() {
    UI.chat = [];
    pushMsg("bot", "text", { text:
      "I'm Atlas. Tell me what you need in plain English and I'll work out which " +
      "process it is, who is accountable for it right now, and send it to them.\n\n" +
      "You can also ask me who owns something, who is out of office, or where your " +
      "requests have got to." });
    pushMsg("bot", "suggest", { items: SUGGESTIONS });
  }

  /* ---------------------------- bot responses --------------------------- */

  function botRequest(text) {
    const matches = E.matchProcesses(S.processes, text, 3);
    const top = matches[0];
    if (!top || top.confidence < 25) {
      pushMsg("bot", "text", { text:
        "I couldn't match that to a process I know about. Pick the closest one and " +
        "I'll route it, or rephrase and I'll try again." });
      pushMsg("bot", "pick", { query: text, options: matches.map(m => m.process_id) });
      return;
    }
    openDraft(text, top.process_id, matches);
  }

  function openDraft(query, processId, matches) {
    const proc = E.process_(S, processId);
    const res = E.resolve(S, proc);
    const me = actor();
    UI.draft = {
      query, processId,
      title: E.suggestTitle(query, proc ? proc.name : null),
      body: E.draftBody(me, proc, res, query),
    };
    pushMsg("bot", "match", {
      query, processId,
      matchIds: (matches || E.matchProcesses(S.processes, query, 3)).map(m => m.process_id),
    });
  }

  function botWhoOwns(text) {
    const proc = E.findProcess(S, text);
    if (!proc) {
      pushMsg("bot", "text", { text:
        "I'm not sure which process you mean. Name it — invoice approval, KYC refresh, " +
        "NDA review, data room access — and I'll tell you who is accountable." });
      return;
    }
    pushMsg("bot", "owners", { processId: proc.id });
  }

  function botOoo() {
    const at = now();
    const away = S.people.filter(p => E.isOutOfOffice(p, at))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!away.length) {
      pushMsg("bot", "text", { text: "Nobody is marked out of office right now." });
      return;
    }
    pushMsg("bot", "ooo", { ids: away.map(p => p.id) });
  }

  function botInbox() {
    const rows = S.requests.filter(r => r.assignee_id === UI.actor &&
      E.OPEN_STATUSES.includes(r.status)).sort((a, b) => b.last_action_at - a.last_action_at);
    pushMsg("bot", "reqlist", { ids: rows.map(r => r.id), mine: false,
      empty: "Nothing is sitting with you right now." });
  }

  function botMyRequests() {
    const rows = S.requests.filter(r => r.requester_id === UI.actor)
      .sort((a, b) => b.created_at - a.created_at);
    pushMsg("bot", "reqlist", { ids: rows.map(r => r.id), mine: true,
      empty: "You haven't raised anything yet. Tell me what you need and I'll route it." });
  }

  function botAbout(text) {
    const p = E.findPerson(S, text);
    if (!p) {
      pushMsg("bot", "text", { text:
        "I couldn't find that person. Try their full name, or browse the org chart " +
        "under People." });
      return;
    }
    pushMsg("bot", "person", { id: p.id });
  }

  function botHelp() {
    pushMsg("bot", "text", { text:
      "Here's what I can do:\n\n" +
      "• Raise a request — just describe it. I'll find the process, work out who is " +
      "accountable right now, show you my reasoning, and draft the message.\n" +
      "• Answer \"who owns invoice approval?\" or \"who approves valuation sign-off?\"\n" +
      "• Tell you who is out of office.\n" +
      "• Show your inbox, or where your requests have got to.\n\n" +
      "Once something is sent, the agent takes over: it chases after 48 hours, hands " +
      "over to a cover, then escalates to a manager. Use the clock buttons on the left " +
      "to watch that happen in seconds." });
    pushMsg("bot", "suggest", { items: SUGGESTIONS });
  }

  function submitChat(text) {
    text = String(text || "").trim();
    if (!text) return;
    pushMsg("user", "text", { text });
    UI.draft = null;
    const { intent } = E.classify(text);
    switch (intent) {
      case "help":        botHelp(); break;
      case "who_ooo":     botOoo(); break;
      case "who_owns":    botWhoOwns(text); break;
      case "my_inbox":    botInbox(); break;
      case "my_requests": botMyRequests(); break;
      case "about":       botAbout(text); break;
      default:            botRequest(text);
    }
  }

  /* ------------------------------ rendering ----------------------------- */

  function bubbleUser(m) {
    return `<div class="msg user"><div class="bub">${esc(m.data.text)}</div></div>`;
  }

  function botWrap(inner, extraClass) {
    return `<div class="msg bot ${extraClass || ""}">
      <div class="ava" aria-hidden="true">A</div><div class="bub">${inner}</div></div>`;
  }

  function renderMatch(m) {
    const { query, processId, matchIds } = m.data;
    const proc = E.process_(S, processId);
    const all = E.matchProcesses(S.processes, query, 3);
    const top = all.find(x => x.process_id === processId) || all[0];
    const res = E.resolve(S, proc);
    const isCurrent = UI.draft && UI.draft.processId === processId && UI.draft.query === query;
    const dupes = isCurrent ? E.findSimilarOpen(S, { process_id: processId,
      requester_id: UI.actor, title: UI.draft.title }) : [];

    const kw = top && top.matched_keywords.length
      ? top.matched_keywords.slice(0, 5).map(k => badge(k, "role")).join(" ") : "";

    // Only offer runners-up that actually scored; a 0% suggestion is noise.
    const alts = (matchIds || []).filter(id => id !== processId)
      .map(id => all.find(x => x.process_id === id))
      .filter(x => x && x.confidence >= 15).slice(0, 2);
    const alternatives = alts.map(x => `<button class="chip sm" data-act="switchproc"
        data-id="${x.process_id}" data-mid="${m.id}">${esc(x.process_name)}
        <span class="muted">${x.confidence.toFixed(0)}%</span></button>`).join("") +
      `<button class="chip sm" data-act="repick">Pick another process</button>`;

    const steps = `<div class="trail tight">` + res.steps.map(s =>
      `<div class="node ${s.outcome}"><div class="k">${esc(s.label)}</div>
       <div class="d">${esc(s.detail)}</div></div>`).join("") + `</div>`;

    const dupeBlock = dupes.length ? `<div class="note warn tight">
        <strong>Possible duplicate.</strong> ${esc(dupes[0].reason)}
        <div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn sm" data-act="follow" data-id="${dupes[0].request.id}">
            Follow #${dupes[0].request.id} instead</button></div></div>` : "";

    const draftBlock = isCurrent ? `
      <div class="draft">
        <label class="lbl" for="dt">Title</label>
        <input id="dt" class="field" data-act="dtitle" value="${esc(UI.draft.title)}">
        <label class="lbl" for="db" style="margin-top:9px">Message to ${esc(res.assignee_name || "the admin")}</label>
        <textarea id="db" class="field" data-act="dbody" rows="7">${esc(UI.draft.body)}</textarea>
        <div class="acts">
          <button class="btn primary" data-act="chatsend">Send it</button>
          <button class="btn" data-act="chatcancel">Cancel</button>
          <span class="muted" style="align-self:center">Not right?</span>${alternatives}
        </div>
      </div>` : `<p class="muted">This draft has been dealt with.</p>`;

    return botWrap(`
      <p>That looks like <strong>${esc(proc.name)}</strong>${top ?
        ` — ${badge(top.confidence.toFixed(0) + "% · " + top.confidence_label,
          top.confidence >= 70 ? "gold" : "mute")}` : ""}</p>
      ${top ? `<p class="sub small">${esc(E.why(top))}</p>` : ""}
      ${kw ? `<div class="chips tight">${kw}</div>` : ""}
      <div class="who-now"><span class="lbl">Who is accountable right now</span>${steps}
        <div class="note ${res.needs_admin ? "bad" : "info"} tight">${esc(E.resolutionSummary(res))}</div>
      </div>
      ${dupeBlock}
      ${draftBlock}`);
  }

  function renderSent(m) {
    const r = E.request(S, m.data.id);
    if (!r) return botWrap(`<p>That request no longer exists.</p>`);
    const a = r.assignee_id ? person(r.assignee_id) : null;
    const proc = r.process_id ? E.process_(S, r.process_id) : null;
    return botWrap(`
      <p>Sent. <strong>#${r.id}</strong> is with <strong>${esc(a ? a.name : "the Atlas admin")}</strong>.</p>
      <div class="card flag tight">
        <div class="card-t">#${r.id} — ${esc(r.title)}</div>
        <div class="card-m">${statusBadge(r.status)}<span>${esc(proc ? proc.name : "Unmatched")}</span>
          <span class="mono">raised ${esc(human(now() - r.created_at))} ago</span></div>
      </div>
      <p class="sub small">I'll chase it automatically if it isn't acknowledged within 48 hours.</p>
      <div class="acts">
        <button class="btn sm" data-act="open" data-id="${r.id}">View the timeline</button>
        <button class="btn sm" data-act="adv" data-h="48">Skip forward 48h and watch me chase it</button>
      </div>`);
  }

  function renderOwners(m) {
    const proc = E.process_(S, m.data.processId);
    const at = now();
    const res = E.resolve(S, proc);
    const roleRow = role => {
      const list = E.holders(S, proc.id, role);
      if (!list.length) return `<div class="kv"><span class="k">${esc(role[0].toUpperCase() +
        role.slice(1))}</span><span class="muted">not configured</span></div>`;
      return `<div class="kv"><span class="k">${esc(role[0].toUpperCase() + role.slice(1))}</span>
        <span class="chips">${list.map(p => badge(p.name +
          (E.isOutOfOffice(p, at) ? " · away" : ""),
          E.isOutOfOffice(p, at) ? "ooo" : "role")).join(" ")}</span></div>`;
    };
    return botWrap(`
      <p><strong>${esc(proc.name)}</strong> — ${esc(proc.category)}</p>
      ${["owner", "approver", "delegate", "backup"].map(roleRow).join("")}
      <div class="note ${res.needs_admin ? "bad" : "info"} tight">
        ${esc(res.needs_admin ? res.steps[res.steps.length - 1].detail
          : "Right now it would go to " + res.assignee_name + ".")}</div>
      <div class="acts"><button class="btn sm" data-act="process" data-id="${proc.id}">
        Open the process</button></div>`);
  }

  function renderOoo(m) {
    const rows = m.data.ids.map(id => person(id)).filter(Boolean);
    return botWrap(`<p>${rows.length} ${rows.length === 1 ? "person is" : "people are"} out of office:</p>
      <div class="stack tight">${rows.map(p => {
        const covers = S.responsibilities.filter(r => r.person_id === p.id && r.role === "owner")
          .map(r => E.process_(S, r.process_id).name);
        return `<div class="card">
          <div class="card-t">${esc(p.name)} ${badge("back " + E.fmtDate(p.ooo_until), "ooo")}</div>
          <div class="card-m"><span>${esc(p.title)}</span>
            ${covers.length ? `<span>owns ${esc(covers.join(", "))}</span>` : ""}</div>
        </div>`;
      }).join("")}</div>
      <p class="sub small">Requests for anything they own are routed to a delegate automatically.</p>`);
  }

  function renderReqList(m) {
    const rows = m.data.ids.map(id => E.request(S, id)).filter(Boolean);
    if (!rows.length) return botWrap(`<p>${esc(m.data.empty)}</p>`);
    return botWrap(`<p>${rows.length} request${rows.length === 1 ? "" : "s"}:</p>
      <div class="stack tight">${rows.slice(0, 8).map(r => {
        const other = m.data.mine ? r.assignee_id : r.requester_id;
        const op = other ? person(other) : null;
        return `<div class="rowline"><div class="card">
          <div class="card-t">#${r.id} — ${esc(r.title)}</div>
          <div class="card-m">${statusBadge(r.status)}
            <span>${m.data.mine ? "with" : "from"} ${esc(op ? op.name : "—")}</span>
            <span class="mono">${esc(human(now() - r.created_at))} old</span></div>
        </div><button class="btn sm" data-act="open" data-id="${r.id}">Open</button></div>`;
      }).join("")}</div>`);
  }

  function renderPersonMsg(m) {
    const p = person(m.data.id);
    if (!p) return botWrap(`<p>That person is no longer in the directory.</p>`);
    const at = now();
    const stats = E.personStats(S, p.id);
    const grouped = E.responsibilitiesOf(S, p.id);
    const mgr = p.manager_id ? person(p.manager_id) : null;
    const owns = (grouped.owner || []).map(x => x.name);
    return botWrap(`
      <p><strong>${esc(p.name)}</strong> — ${esc(p.title)}, ${esc(E.departmentName(S, p))}
        ${E.isOutOfOffice(p, at) ? badge("out of office", "ooo") : ""}</p>
      <div class="kv"><span class="k">Reports to</span>${esc(mgr ? mgr.name : "—")}</div>
      <div class="kv"><span class="k">Owns</span>${owns.length ?
        `<span class="chips">${owns.map(n => badge(n, "role")).join(" ")}</span>` :
        `<span class="muted">nothing directly</span>`}</div>
      <div class="kv"><span class="k">Open load</span>${stats.open_load} request(s)</div>
      <div class="acts"><button class="btn sm" data-act="treeperson" data-id="${p.id}">
        Show in the org chart</button></div>`);
  }

  function renderPick(m) {
    const opts = S.processes.slice().sort((a, b) => a.name.localeCompare(b.name));
    return botWrap(`<div class="picker">
      <label class="lbl" for="pk">Route it as</label>
      <select id="pk" class="field" data-act="pickproc" data-mid="${m.id}">
        <option value="">Choose a process…</option>
        ${opts.map(p => `<option value="${p.id}">${esc(p.name)} — ${esc(p.category)}</option>`).join("")}
      </select></div>`);
  }

  function renderMsg(m) {
    if (m.role === "user") return bubbleUser(m);
    switch (m.kind) {
      case "match":   return renderMatch(m);
      case "sent":    return renderSent(m);
      case "owners":  return renderOwners(m);
      case "ooo":     return renderOoo(m);
      case "reqlist": return renderReqList(m);
      case "person":  return renderPersonMsg(m);
      case "pick":    return renderPick(m);
      case "suggest":
        return `<div class="chips suggest">${m.data.items.map(s =>
          `<button class="chip" data-act="say" data-text="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
      default:
        return botWrap(m.data.text.split("\n").map(line =>
          line.trim() ? `<p>${esc(line)}</p>` : "").join(""));
    }
  }

  function pageChat() {
    const me = actor();
    return `<div class="chatpage">
      <div class="chatlog" id="chatlog">
        ${UI.chat.map(renderMsg).join("")}
      </div>
      <form class="composer" data-act="chatform">
        <label class="sr" for="composer">Message Atlas</label>
        <textarea id="composer" rows="1" placeholder="Tell Atlas what you need…"
          data-act="composer"></textarea>
        <button class="btn primary" type="submit" data-act="chatsubmit">Send</button>
      </form>
      <p class="muted composer-note">Acting as ${esc(me.name)} · everything runs locally,
        nothing leaves your browser</p>
    </div>`;
  }

  /* ============================ people & org tree ======================= */

  const NODE_W = 186, NODE_H = 62, H_GAP = 18, V_GAP = 58;

  const DEPT_HUE = {
    "Executive": "var(--gold)", "Investments / Deal Team": "var(--s1)",
    "Finance": "var(--dept-b)", "Legal & Compliance": "var(--dept-c)",
    "IT": "var(--dept-d)", "Operations / HR": "var(--dept-e)",
  };
  const deptColor = d => DEPT_HUE[d] || "var(--ink-3)";

  const isCollapsed = id => !!UI.tree.collapsed[id];

  function findNode(roots, id) {
    for (const r of roots) {
      if (r.id === id) return r;
      const found = findNode(r.children, id);
      if (found) return found;
    }
    return null;
  }

  // Best-match first: a name that starts with the term beats one that merely
  // contains it, which beats a title or team hit.
  function searchMatches(term) {
    const t = String(term || "").trim().toLowerCase();
    if (!t) return [];
    const score = p => {
      const n = p.name.toLowerCase();
      if (n.startsWith(t)) return 4;
      if (n.split(" ").some(w => w.startsWith(t))) return 3;
      if (n.includes(t)) return 2;
      if (p.title.toLowerCase().includes(t)) return 1;
      return 0;
    };
    return S.people
      .map(p => ({ p, s: Math.max(score(p),
        E.departmentName(S, p).toLowerCase().includes(t) ? 1 : 0) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.p.name.localeCompare(b.p.name))
      .map(x => x.p);
  }

  // Tidy-tree layout: leaves take the next slot, parents centre over children.
  function layoutTree(roots) {
    const cursor = { x: 0 };
    const placed = [];
    const walk = (node, depth) => {
      const kids = isCollapsed(node.id) ? [] : node.children;
      let x;
      if (!kids.length) {
        x = cursor.x;
        cursor.x += NODE_W + H_GAP;
      } else {
        const childXs = kids.map(k => walk(k, depth + 1));
        x = (childXs[0] + childXs[childXs.length - 1]) / 2;
      }
      placed.push({ node, x, y: depth * (NODE_H + V_GAP), depth });
      return x;
    };
    roots.forEach(r => walk(r, 0));
    const width = Math.max(cursor.x, NODE_W + H_GAP);
    const depth = Math.max(...placed.map(p => p.y)) + NODE_H + 14;
    return { placed, width, height: depth };
  }

  function treeSVG() {
    const dept = UI.tree.dept;
    const forest = E.orgTree(S);
    // Focusing re-roots the chart on one person, which hides everyone above them.
    const focused = UI.tree.root ? findNode(forest, UI.tree.root) : null;
    const roots = focused ? [focused] : forest;
    const { placed, width, height } = layoutTree(roots);
    const byId = new Map(placed.map(p => [p.node.id, p]));
    const at = now();

    const edges = placed.filter(p => p.node.manager_id && byId.has(p.node.manager_id))
      .map(p => {
        const parent = byId.get(p.node.manager_id);
        const x1 = parent.x + NODE_W / 2, y1 = parent.y + NODE_H;
        const x2 = p.x + NODE_W / 2, y2 = p.y;
        const mid = y1 + V_GAP / 2;
        return `<path d="M${x1} ${y1} V${mid} H${x2} V${y2}" fill="none"
          stroke="var(--line)" stroke-width="1.5"/>`;
      }).join("");

    const nodes = placed.map(p => {
      const n = p.node;
      const pers = person(n.id);
      const ooo = pers && E.isOutOfOffice(pers, at);
      const load = S.requests.filter(r => r.assignee_id === n.id &&
        E.OPEN_STATUSES.includes(r.status)).length;
      const hidden = n.children.length && isCollapsed(n.id);
      const dim = dept !== "All departments" && n.department !== dept;
      const selected = UI.tree.selected === n.id;
      const toggle = n.children.length ? `
        <g class="tgl" data-act="treetoggle" data-id="${n.id}" tabindex="0"
           role="button" aria-label="${hidden ? "Expand" : "Collapse"} ${esc(n.name)}'s team">
          <circle cx="${NODE_W / 2}" cy="${NODE_H + 1}" r="10"
            fill="var(--surface)" stroke="var(--line)"/>
          <text x="${NODE_W / 2}" y="${NODE_H + 5}" text-anchor="middle"
            class="tglt">${hidden ? "+" + n.descendants : "–"}</text>
        </g>` : "";
      return `<g class="onode${dim ? " dim" : ""}${selected ? " sel" : ""}"
          transform="translate(${p.x},${p.y})">
        <g data-act="treeselect" data-id="${n.id}" tabindex="0" role="button"
           aria-label="${esc(n.name)}, ${esc(n.title)}">
          <rect class="obox" width="${NODE_W}" height="${NODE_H}" rx="9"/>
          <rect class="ostripe" width="4" height="${NODE_H}" rx="2" fill="${deptColor(n.department)}"/>
          <text class="oname" x="14" y="24">${esc(n.name)}</text>
          <text class="otitle" x="14" y="41">${esc(n.title.length > 30 ?
            n.title.slice(0, 28) + "…" : n.title)}</text>
          <text class="ometa" x="14" y="55">${esc(n.department)}${
            n.reports ? " · " + n.reports + " report" + (n.reports === 1 ? "" : "s") : ""}</text>
          ${ooo ? `<circle cx="${NODE_W - 14}" cy="20" r="5" fill="var(--warn)"/>
                   <title>Out of office</title>` : ""}
          ${load ? `<text class="oload" x="${NODE_W - 12}" y="55" text-anchor="end">${load} open</text>` : ""}
        </g>${toggle}</g>`;
    }).join("");

    const t = UI.tree;
    return `<svg id="treesvg" viewBox="0 0 ${width} ${height + 24}"
      style="width:${Math.round(width * t.zoom)}px;height:${Math.round((height + 24) * t.zoom)}px"
      role="img" aria-label="Organisation chart of ${S.people.length} people">
      <g>${edges}${nodes}</g></svg>`;
  }

  // Deliberately short: a first-time viewer needs who they are, who they report
  // to, and what they own. Everything else is a click away in Ask Atlas.
  function treeDetail() {
    const id = UI.tree.selected;
    if (!id) return "";
    const p = person(id);
    if (!p) return "";
    const at = now();
    const mgr = p.manager_id ? person(p.manager_id) : null;
    const reports = S.people.filter(x => x.manager_id === id).length;
    const owns = (E.responsibilitiesOf(S, id).owner || []).map(x => x.name);

    return `<div class="side-head">
        <div><h3>${esc(p.name)}</h3><p class="sub">${esc(p.title)}</p></div>
        <button class="btn sm" data-act="treeclose" aria-label="Close">✕</button>
      </div>
      <div class="chips tight">${badge(E.departmentName(S, p), "role")}
        ${E.isOutOfOffice(p, at) ? badge("Away until " + E.fmtDate(p.ooo_until), "ooo") : ""}</div>
      <div class="kv"><span class="k">Reports to</span>${esc(mgr ? mgr.name : "Nobody — top of the firm")}</div>
      ${reports ? `<div class="kv"><span class="k">Team</span>${reports} direct report${
        reports === 1 ? "" : "s"}</div>` : ""}
      <div class="kv"><span class="k">Owns</span>${owns.length
        ? esc(owns.join(", ")) : `<span class="muted">nothing directly</span>`}</div>
      <div class="acts">
        ${UI.tree.root === p.id
          ? `<button class="btn sm" data-act="focusclear">Show whole firm</button>`
          : `<button class="btn sm" data-act="focusperson" data-id="${p.id}">Show just their team</button>`}
      </div>`;
  }

  function pagePeople() {
    if (UI.process) return processProfile(UI.process);
    const which = UI.tab.people || "org";
    const tabs = [["org", "Org chart"], ["list", "Directory"], ["teams", "Teams"],
                  ["processes", "Processes"]]
      .map(([k, t]) => `<button class="tab" role="tab" data-act="subtab" data-group="people"
        data-k="${k}" aria-selected="${which === k}">${esc(t)}</button>`).join("");
    const tabsBar = `<div class="tabs" role="tablist">${tabs}</div>`;
    if (which === "org") return tabsBar + orgPanel();
    const head = phead("People", "Who works here, and who they answer to",
      "Search anyone, expand a team, and see what each person is actually accountable for.") +
      tabsBar;
    if (which === "list") return head + peopleList();
    if (which === "teams") return head + teamsPanel();
    return head + processList();
  }

  function orgPanel() {
    const t = UI.tree;
    const legend = Object.keys(DEPT_HUE).map(d =>
      `<span><i style="background:${deptColor(d)}"></i>${esc(d)}</span>`).join("");
    return `<div class="orgtools">
        <div class="findwrap">
          <label class="sr" for="ts">Find someone</label>
          <input id="ts" class="field" data-act="treequery" role="combobox" autocomplete="off"
            aria-expanded="false" aria-controls="suggestbox" aria-autocomplete="list"
            placeholder="Find someone by name…" value="${esc(t.query || "")}">
          <div class="suggest-list" id="suggestbox" role="listbox" aria-label="Matching people" hidden></div>
        </div>
        <select class="field slim" data-act="treedept" aria-label="Highlight a team">
          ${deptOptions(t.dept)}</select>
        <div class="zoomer" role="group" aria-label="Zoom">
          <button class="btn sm" data-act="zoom" data-d="-1" aria-label="Zoom out">−</button>
          <span class="mono zoomv">${Math.round(t.zoom * 100)}%</span>
          <button class="btn sm" data-act="zoom" data-d="1" aria-label="Zoom in">+</button>
          <button class="btn sm" data-act="zoomfit">Fit</button>
        </div>
        <button class="btn sm" data-act="expandall">Expand all</button>
        <button class="btn sm" data-act="collapseall">Collapse</button>
      </div>
      ${focusBar()}
      <div class="orgstage">
        <div class="orgscroll" id="orgscroll" data-act="orgpan">${treeSVG()}</div>
        ${UI.tree.selected ? `<aside class="orgpanel">${treeDetail()}</aside>` : ""}
        <div class="orglegend">${legend}<span><i class="ooo-dot"></i>Away</span></div>
      </div>`;
  }

  function focusBar() {
    const focused = UI.tree.root ? person(UI.tree.root) : null;
    const matches = searchMatches(UI.tree.search);
    const others = matches.filter(p => !focused || p.id !== focused.id).slice(0, 5);

    if (!focused) {
      if (!matches.length) return "";
      return `<div class="focusbar">
        <span class="fb-label">${matches.length} match${matches.length === 1 ? "" : "es"}</span>
        <div class="chips">${others.map(p => `<button class="chip sm" data-act="focusperson"
          data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div></div>`;
    }

    const mgr = focused.manager_id ? person(focused.manager_id) : null;
    const above = E.pathToRoot(S, focused.id).length - 1;
    return `<div class="focusbar on">
      <span class="fb-label">Showing ${esc(focused.name)}${
        focused.manager_id ? ` and their team only` : ``}</span>
      ${mgr ? `<button class="btn sm" data-act="focusup" data-id="${mgr.id}">
        ↑ Up to ${esc(mgr.name)}</button>` : ""}
      ${above ? `<span class="muted">${above} level${above === 1 ? "" : "s"} hidden above</span>` : ""}
      <button class="btn sm" data-act="focusclear">Show whole firm</button>
      ${others.length ? `<span class="muted">Other matches:</span>
        <div class="chips">${others.map(p => `<button class="chip sm" data-act="focusperson"
          data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>` : ""}
    </div>`;
  }

  function teamsPanel() {
    const teams = E.teamSummary(S);
    const at = now();
    return `<div class="stack">${teams.map(t => {
      const members = S.people.filter(p => E.departmentName(S, p) === t.department)
        .sort((a, b) => a.name.localeCompare(b.name));
      const owned = S.responsibilities.filter(r => r.role === "owner" &&
        members.some(m => m.id === r.person_id)).length;
      const load = S.requests.filter(r => E.OPEN_STATUSES.includes(r.status) &&
        members.some(m => m.id === r.assignee_id)).length;
      return `<div class="card">
        <div class="card-t"><span class="swatch" style="background:${deptColor(t.department)}"></span>
          ${esc(t.department)}</div>
        <div class="card-m"><span>Led by ${esc(t.head || "—")}</span>
          <span>${t.size} people</span>
          ${badge(owned + " processes owned", "role")}
          ${badge(load + " open requests", load ? "gold" : "mute")}
          ${t.ooo ? badge(t.ooo + " away", "ooo") : ""}</div>
        <div class="chips tight">${members.map(m =>
          `<button class="chip sm" data-act="treeperson" data-id="${m.id}">${esc(m.name)}</button>`
        ).join("")}</div>
      </div>`;
    }).join("")}</div>`;
  }

  function deptOptions(selected) {
    const names = ["All departments"].concat(S.departments.map(d => d.name).sort());
    return names.map(n => `<option${n === selected ? " selected" : ""}>${esc(n)}</option>`).join("");
  }

  function peopleList() {
    const at = now();
    const term = (UI.search || "").trim().toLowerCase();
    const rows = S.people.slice().sort((a, b) => a.name.localeCompare(b.name)).filter(p => {
      const dept = E.departmentName(S, p);
      if (UI.dept !== "All departments" && dept !== UI.dept) return false;
      if (term && !(p.name.toLowerCase().includes(term) || p.title.toLowerCase().includes(term)))
        return false;
      return true;
    });
    const cards = rows.map(p => {
      const owned = S.responsibilities.filter(r => r.person_id === p.id &&
        (r.role === "owner" || r.role === "approver")).length;
      const load = S.requests.filter(r => r.assignee_id === p.id &&
        E.OPEN_STATUSES.includes(r.status)).length;
      const ooo = E.isOutOfOffice(p, at);
      return `<div class="rowline"><div class="card">
        <div class="card-t">${esc(p.name)}</div>
        <div class="card-m"><span>${esc(p.title)}</span><span>${esc(E.departmentName(S, p))}</span></div>
        <div class="card-m" style="margin-top:7px">${badge(owned + " owned/approved", "role")}
          ${badge(load + " open", load ? "gold" : "mute")}
          ${ooo ? badge("OOO until " + E.fmtDate(p.ooo_until), "ooo") : ""}</div>
      </div><button class="btn sm" data-act="treeperson" data-id="${p.id}">Org chart</button></div>`;
    }).join("");
    return `<div class="toolbar">
        <div class="grow"><label class="lbl" for="ps">Search people</label>
          <input id="ps" class="field" data-act="search" placeholder="name or title"
            value="${esc(UI.search || "")}"></div>
        <div class="grow"><label class="lbl" for="pd">Department</label>
          <select id="pd" class="field" data-act="dept">${deptOptions(UI.dept)}</select></div>
      </div>
      <p class="muted" style="margin-bottom:9px">${rows.length} people</p>` +
      (rows.length ? `<div class="stack">${cards}</div>` : empty("Nobody matches that search."));
  }

  function processList() {
    const at = now();
    const cards = S.processes.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => {
      const owners = E.holders(S, p.id, "owner");
      const dels = E.holders(S, p.id, "delegate");
      const open = S.requests.filter(r => r.process_id === p.id &&
        E.OPEN_STATUSES.includes(r.status)).length;
      const ownerBadge = owners.length
        ? badge("Owner: " + owners[0].name, E.isOutOfOffice(owners[0], at) ? "ooo" : "role")
        : badge("Orphan — no owner", "escalated");
      return `<div class="rowline"><div class="card${owners.length ? "" : " alarm"}">
        <div class="card-t">${esc(p.name)}</div>
        <div class="card-m"><span>${esc(p.category)}</span></div>
        <div class="card-m" style="margin-top:7px">${ownerBadge}
          ${dels.length ? badge("Delegate: " + dels[0].name, "mute") : ""}
          ${badge(open + " open", open ? "gold" : "mute")}</div>
      </div><button class="btn sm" data-act="process" data-id="${p.id}">View</button></div>`;
    }).join("");
    return `<div class="stack">${cards}</div>`;
  }

  function processProfile(id) {
    const p = E.process_(S, id);
    if (!p) { UI.process = null; return pagePeople(); }
    const at = now();
    const stats = E.processStats(S, id);
    const orphan = !E.holders(S, id, "owner").length;
    const recent = S.requests.filter(r => r.process_id === id)
      .sort((a, b) => b.created_at - a.created_at).slice(0, 8);
    const roleRows = ["owner", "approver", "delegate", "backup"].map(role => {
      const list = E.holders(S, id, role);
      if (!list.length) return `<div class="kv"><span class="k">${esc(role[0].toUpperCase() +
        role.slice(1))}</span><span class="muted">not configured</span></div>`;
      return `<div class="kv"><span class="k">${esc(role[0].toUpperCase() + role.slice(1))}</span>
        <span class="chips">${list.map(x => badge(x.name + (E.isOutOfOffice(x, at) ? " · OOO" : ""),
          E.isOutOfOffice(x, at) ? "ooo" : "role")).join(" ")}</span></div>`;
    }).join("");
    return `<button class="btn sm" data-act="backdir">← Back to processes</button>
      <div class="card ${orphan ? "alarm" : "flag"}" style="margin-top:13px">
        <div class="card-t">${esc(p.name)} ${orphan ? badge("Orphan — no owner", "escalated") : ""}</div>
        <div class="card-m"><span>${esc(p.category)}</span></div>
        <div class="card-b">${esc(p.description)}</div>
      </div>
      <div class="tiles" style="margin-top:16px">
        ${tile("Requests", String(stats.total), "all time")}
        ${tile("Open now", String(stats.open), "in the queue", stats.open ? "warn" : "")}
        ${tile("Completed", String(stats.completed), "all time")}
        ${tile("Avg turnaround", stats.avg_turnaround_hours !== null ?
               Math.round(stats.avg_turnaround_hours) + "h" : "—", "raised to completed")}
      </div>
      <div class="grid2">
        <div><h2>Who is accountable</h2>
          ${orphan ? `<div class="note bad" style="margin:9px 0">Nobody owns this process.
            Requests matched to it are parked for the Atlas admin.</div>` : ""}
          <div style="margin-top:9px">${roleRows}</div>
          <h2 style="margin-top:20px">Matching keywords</h2>
          <div class="chips" style="margin-top:9px">${
            E.keywordList(p).map(k => badge(k, "mute")).join(" ") || `<span class="muted">none</span>`}</div>
        </div>
        <div><h2>Recent requests</h2><div class="stack" style="margin-top:9px">${
          recent.length ? recent.map(r => `<div class="card">
            <div class="card-t">#${r.id} — ${esc(r.title)}</div>
            <div class="card-m">${statusBadge(r.status)}
              <span>with ${esc(r.assignee_id ? person(r.assignee_id).name : "Unassigned")}</span>
              <span class="mono">${esc(human(now() - r.created_at))} old</span></div></div>`).join("")
            : empty("No requests have used this process yet.")}</div></div>
      </div>`;
  }

  /* ============================== requests ============================== */

  function requestRow(r, counterpartId, label) {
    const proc = r.process_id ? E.process_(S, r.process_id) : null;
    const cp = counterpartId ? person(counterpartId) : null;
    const unread = S.messages.filter(m => m.request_id === r.id && !m.read &&
      m.recipient_id === UI.actor).length;
    const chase = r.chase_count ? ` · ${r.chase_count} chase${r.chase_count === 1 ? "" : "s"}` : "";
    return `<div class="rowline">
      <div class="card ${r.status === "escalated" ? "alarm" : (r.status === "pending" ? "flag" : "")}">
        <div class="card-t">#${r.id} — ${esc(r.title)}</div>
        <div class="card-m">${statusBadge(r.status)}
          <span>${esc(proc ? proc.name : "Unmatched")}</span>
          <span>${esc(label)} ${esc(cp ? cp.name : "—")}</span>
          <span class="mono">raised ${esc(human(now() - r.created_at))} ago · quiet for ${
            esc(human(now() - r.last_action_at))}${esc(chase)}</span></div>
      </div>
      <button class="btn sm" data-act="open" data-id="${r.id}">Open${unread ? ` (${unread})` : ""}</button>
    </div>`;
  }

  function pageRequests() {
    if (UI.open) return requestDetail(UI.open);
    const me = actor();
    const open = S.requests.filter(r => r.assignee_id === UI.actor && E.OPEN_STATUSES.includes(r.status))
      .sort((a, b) => b.last_action_at - a.last_action_at);
    const mine = S.requests.filter(r => r.requester_id === UI.actor)
      .sort((a, b) => b.created_at - a.created_at);
    const done = S.requests.filter(r => r.assignee_id === UI.actor && r.status === "completed")
      .sort((a, b) => b.last_action_at - a.last_action_at);
    const which = UI.tab.requests || "inbox";
    const rows = which === "inbox" ? open : which === "mine" ? mine : done;
    const label = which === "mine" ? "with" : "from";
    const cp = r => which === "mine" ? r.assignee_id : r.requester_id;

    const tabs = [["inbox", `My inbox (${open.length})`], ["mine", `My requests (${mine.length})`],
                  ["done", "Completed by me"]].map(([k, t]) =>
      `<button class="tab" role="tab" data-act="subtab" data-group="requests" data-k="${k}"
        aria-selected="${which === k}">${esc(t)}</button>`).join("");

    const caption = which === "inbox" ? "Work Atlas has routed to you, newest activity first."
      : which === "mine" ? "Everything you have raised, including what the agent has done with it."
      : "Requests you have closed.";

    return phead("Requests", `${me.name}'s desk`,
      `${open.length} open with you · ${mine.length} raised by you · ${unreadFor(UI.actor)} unread`) +
      `<div class="tabs" role="tablist">${tabs}</div>
       <p class="sub" style="margin-bottom:11px">${esc(caption)}</p>` +
      (rows.length ? `<div class="stack">${rows.map(r => requestRow(r, cp(r), label)).join("")}</div>`
        : empty("Nothing here.", "Ask Atlas for something and it will show up on the other side."));
  }

  function requestDetail(id) {
    const r = E.request(S, id);
    if (!r) { UI.open = null; return pageRequests(); }
    E.markRead(S, UI.actor, id);
    const proc = r.process_id ? E.process_(S, r.process_id) : null;
    const a = r.assignee_id ? person(r.assignee_id) : null;
    const req = person(r.requester_id);
    const orig = r.original_assignee_id ? person(r.original_assignee_id) : null;
    const msgs = S.messages.filter(m => m.request_id === id)
      .sort((x, y) => x.created_at - y.created_at || x.id - y.id);
    const isAssignee = r.assignee_id === UI.actor;
    const isOpen = E.OPEN_STATUSES.includes(r.status);

    const actions = !isOpen
      ? `<div class="note info">This request is closed.</div>`
      : isAssignee ? `
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn" data-act="ack" data-id="${id}"${
            r.status === "pending" || r.status === "escalated" ? "" : " disabled"}>Acknowledge</button>
          <button class="btn" data-act="prog" data-id="${id}"${
            r.status === "in_progress" ? " disabled" : ""}>Mark in progress</button>
          <button class="btn primary" data-act="done" data-id="${id}">Complete</button>
        </div>
        <label class="lbl" style="margin-top:13px" for="note">Add a note (sent to the requester)</label>
        <div style="display:flex;gap:9px">
          <input id="note" class="field" data-act="note" value="${esc(UI.note || "")}">
          <button class="btn" data-act="sendnote" data-id="${id}">Send note</button>
        </div>`
      : `<p class="sub">You are watching this request. Switch to
         <strong>${esc(a ? a.name : "the assignee")}</strong> on the left to act on it.</p>`;

    return `<button class="btn sm" data-act="back">← Back to the list</button>

  /* =============================== agent log ============================ */

  const LOG_FILTERS = {

    "Chases": ["chase"],
    "Reroutes": ["reroute","reroute_ooo","reroute_chase"],

  function pageAgentLog() {

    const cards = rows.map(e => {
      const r = e.request_id ? E.request(S, e.request_id) : null;
      const tone = e.type.indexOf("escalation") === 0 ? "escalated"

    return phead("Agent Log", "What the agent did, and why",
      "The agent evaluates its rules against simulated time every couple of seconds. " +
      "Nothing here was triggered by a human.") +
      `<div class="tiles">
        ${tile("Agent", "Running", "last pass " + (S.lastTickAt ? fmtTime(S.lastTickAt) : "—"), "good")}
        ${tile("Chases sent", String(counts.chase), "unacknowledged after 48h")}
        ${tile("Reroutes", String(counts.reroute), "cover picked up the work")}
        ${tile("Escalations", String(counts.esc), "handed to a manager", counts.esc ? "bad" : "")}
      </div>

  /* ================================ charts ============================== */
  /* Hand-built inline SVG: thin marks, rounded data-ends on the baseline,
     recessive grid, selective direct labels, hover tooltip on every mark. */

  const CH = { w: 560, rowH: 30, gap: 9, pad: { l: 124, r: 54, t: 8, b: 26 } };

  // Department names are long; the axis has a fixed gutter, so trim to fit.
  const SHORT = { "Investments / Deal Team": "Investments", "Legal & Compliance": "Legal & Comp.",
                  "Operations / HR": "Operations" };
  const shortLabel = s => SHORT[s] || s;
  const tipAttr = (title, body) =>
    `data-tip="${esc(title)}" data-tipb="${esc(body)}" tabindex="0"`;

  function barTrack(x, y, w, h) {
    return `<rect x="${x}" y="${y}" width="${Math.max(w, 0)}" height="${h}" rx="4" ry="4"
      class="bar" />`;
  }

  // Horizontal category bars, one series. Identity comes from the axis label,
  // so colour is not carrying meaning; escalated is tinted as a status.
  function hbar(rows, opts) {
    opts = opts || {};
    const max = Math.max(1, ...rows.map(r => r.value));
    const h = CH.pad.t + rows.length * (CH.rowH + CH.gap) + CH.pad.b;
    const plotW = CH.w - CH.pad.l - CH.pad.r;
    const ticks = niceTicks(max, 4);
    const grid = ticks.map(t => {
      const x = CH.pad.l + (t / max) * plotW;
      return `<line class="gl" x1="${x}" y1="${CH.pad.t}" x2="${x}" y2="${h - CH.pad.b}"/>
        <text class="axl" x="${x}" y="${h - CH.pad.b + 15}" text-anchor="middle">${t}</text>`;
    }).join("");
    const bars = rows.map((r, i) => {
      const y = CH.pad.t + i * (CH.rowH + CH.gap);
      const w = (r.value / max) * plotW;
      const fill = r.color || "var(--s1)";
      return `<g ${tipAttr(r.label, r.tip || (r.value + " requests"))}>
        <text class="cat" x="${CH.pad.l - 10}" y="${y + CH.rowH / 2 + 4}" text-anchor="end">${esc(shortLabel(r.label))}</text>
        <g fill="${fill}">${barTrack(CH.pad.l, y, w, CH.rowH)}</g>
        <text class="vl" x="${CH.pad.l + w + 7}" y="${y + CH.rowH / 2 + 4}">${r.value}</text>
      </g>`;
    }).join("");
    return `<svg viewBox="0 0 ${CH.w} ${h}" role="img" aria-label="${esc(opts.aria || "bar chart")}">
      ${grid}${bars}</svg>`;
  }

  // Two series, grouped. Legend + direct labels; validated colour pair.
  function groupedBar(rows, opts) {
    const pad = { l: 124, r: 66, t: 8, b: 26 };
    const barH = 13, inner = 5, groupH = barH * 2 + inner, gap = 14;
    const max = Math.max(1, ...rows.map(r => Math.max(r.a, r.b)));
    const h = pad.t + rows.length * (groupH + gap) + pad.b;
    const plotW = CH.w - pad.l - pad.r;
    const ticks = niceTicks(max, 4);
    const grid = ticks.map(t => {
      const x = pad.l + (t / max) * plotW;
      return `<line class="gl" x1="${x}" y1="${pad.t}" x2="${x}" y2="${h - pad.b}"/>
        <text class="axl" x="${x}" y="${h - pad.b + 15}" text-anchor="middle">${t}</text>`;
    }).join("");
    const bars = rows.map((r, i) => {
      const y = pad.t + i * (groupH + gap);
      const wa = (r.a / max) * plotW, wb = (r.b / max) * plotW;
      return `<g>
        <text class="cat" x="${pad.l - 10}" y="${y + groupH / 2 + 4}" text-anchor="end">${esc(shortLabel(r.label))}</text>
        <g fill="var(--s2)" ${tipAttr(r.label, opts.aLabel + ": " + r.a + "h")}>
          ${barTrack(pad.l, y, wa, barH)}</g>
        <text class="vl" x="${pad.l + wa + 6}" y="${y + barH - 2}">${r.a}h</text>
        <g fill="var(--s1)" ${tipAttr(r.label, opts.bLabel + ": " + r.b + "h")}>
          ${barTrack(pad.l, y + barH + inner, wb, barH)}</g>
        <text class="vl" x="${pad.l + wb + 6}" y="${y + barH + inner + barH - 2}">${r.b}h</text>
      </g>`;
    }).join("");
    return `<svg viewBox="0 0 ${CH.w} ${h}" role="img" aria-label="${esc(opts.aria || "grouped bar chart")}">
      ${grid}${bars}</svg>`;
  }

  function histogram(values, opts) {
    const pad = { l: 40, r: 14, t: 10, b: 34 };
    const w = CH.w, h = 210;
    if (!values.length) return "";
    const max = Math.max(...values), bins = 10;
    const size = Math.max(1, Math.ceil(max / bins));
    const counts = new Array(bins).fill(0);
    for (const v of values) counts[Math.min(bins - 1, Math.floor(v / size))]++;
    const top = Math.max(1, ...counts);
    const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
    const bw = plotW / bins;
    const ticks = niceTicks(top, 3);
    const grid = ticks.map(t => {
      const y = pad.t + plotH - (t / top) * plotH;
      return `<line class="gl" x1="${pad.l}" y1="${y}" x2="${w - pad.r}" y2="${y}"/>
        <text class="axl" x="${pad.l - 7}" y="${y + 4}" text-anchor="end">${t}</text>`;
    }).join("");
    const bars = counts.map((c, i) => {
      const bh = (c / top) * plotH;
      const x = pad.l + i * bw + 2, y = pad.t + plotH - bh;
      const lo = i * size, hi = (i + 1) * size;
      return `<g fill="var(--s1)" ${tipAttr(`${lo}–${hi}h old`,
        `${c} open request${c === 1 ? "" : "s"}`)}>
        ${barTrack(x, y, Math.max(bw - 4, 1), Math.max(bh, c ? 3 : 0))}</g>`;
    }).join("");
    const labels = [0, Math.floor(bins / 2), bins].map(i => {
      const x = pad.l + i * bw;
      return `<text class="axl" x="${x}" y="${h - 12}" text-anchor="middle">${i * size}h</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.aria || "histogram")}">
      ${grid}${bars}${labels}</svg>`;
  }

  function niceTicks(max, count) {
    const raw = max / count;
    const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
    const out = [];
    for (let v = 0; v <= max + 1e-9; v += step) out.push(Math.round(v * 10) / 10);
    if (out[out.length - 1] < max) out.push(Math.round((out[out.length - 1] + step) * 10) / 10);
    return out;
  }

  // Backup is distinguished by a dash pattern, not by a paler colour: a fourth
  // hue would not clear the CVD gate, and a near-surface grey is invisible.
  /* =============================== dashboard ============================ */

  function pageDashboard() {
    const at = now();
    const h = E.headline(S);

    const statusRows = status.map(r => ({
      label: r.status, value: r.count,
      color: r.key === "escalated" ? "var(--critical)" : "var(--s1)",
      tip: r.count + " request" + (r.count === 1 ? "" : "s"),
    }));
    const deptRows = depts.map(d => ({
      label: d.department, value: d.count,
      tip: d.count + " open" + (d.escalated ? ` · ${d.escalated} escalated` : ""),
    }));
    const turnRows = turn.map(t => ({ label: t.department, a: t.avg_ack_hours, b: t.avg_complete_hours }));

    const charts = `<div class="charts">
      <div class="chart"><h3>Requests by status</h3>
        <div class="csub">Every request ever raised. Escalated is marked in the critical colour
          and named on the axis.</div>
        ${hbar(statusRows, { aria: "Requests by status" })}</div>
      <div class="chart"><h3>Open requests by department</h3>
        <div class="csub">Where the open queue sits right now.</div>
        ${deptRows.length ? hbar(deptRows, { aria: "Open requests by department" })
          : empty("Nothing open right now.")}</div>
      <div class="chart"><h3>Turnaround by department</h3>
        <div class="legend"><span><i style="background:var(--s2)"></i>Time to acknowledge</span>
          <span><i style="background:var(--s1)"></i>Time to complete</span></div>
        ${turnRows.length ? groupedBar(turnRows, { aLabel: "Time to acknowledge",
          bLabel: "Time to complete", aria: "Turnaround by department" })
          : empty("No completed requests yet.")}</div>
      <div class="chart"><h3>How long open items have been waiting</h3>
        <div class="csub">Age of every open request, in simulated hours.</div>
        ${ages.length ? histogram(ages.map(a => a.age_hours), { aria: "Queue age distribution" })
          : empty("Nothing is waiting.")}</div>
    </div>`;

    const neckTable = necks.length ? `<div class="tblwrap"><table>
      <thead><tr><th>Person</th><th>Title</th><th>Department</th><th class="n">Open</th>
        <th class="n">Avg wait</th><th class="n">Oldest</th><th>Status</th></tr></thead>
      <tbody>${necks.map(b => `<tr><td><strong>${esc(b.person)}</strong></td><td>${esc(b.title)}</td>
        <td>${esc(b.department)}</td><td class="n">${b.open}</td>
        <td class="n">${b.avg_wait_hours}h</td><td class="n">${b.oldest_wait_hours}h</td>
        <td>${b.is_ooo ? badge("Out of office", "ooo") : `<span class="muted">In office</span>`}</td>
        </tr>`).join("")}</tbody></table></div>` : empty("No queues are backing up.");

    const orphanCards = orphans.length ? orphans.map(o => `<div class="card alarm">
        <div class="card-t">${esc(o.process)} ${badge("No owner", "escalated")}</div>
        <div class="card-m"><span>${esc(o.category)}</span>
          <span>${o.open_requests} open request(s)</span>
          <span>other roles configured: ${esc(o.other_roles)}</span></div></div>`).join("")
      : `<div class="note info">Every process has an owner.</div>`;

    const spofCards = spofs.length ? spofs.map(r => {
      const detail = r.uncovered.length ? "Uncovered: " + r.uncovered.join(", ")
        : r.owns ? "Every process they own has a delegate or backup."
        : `Approves on ${r.approves} process(es) but owns none outright.`;
      return `<div class="card${r.uncovered.length ? " alarm" : ""}">
        <div class="card-t">${esc(r.person)}</div>
        <div class="card-m"><span>${esc(r.title)}</span><span>${esc(r.department)}</span></div>
        <div class="card-m" style="margin-top:7px">${badge(r.owns + " owned", "role")}
          ${badge(r.approves + " approved", "role")}
          ${badge(r.open_load + " open", r.open_load ? "gold" : "mute")}
          ${r.is_ooo ? badge("Out of office", "ooo") : ""}
          ${r.uncovered.length ? badge(r.uncovered.length + " uncovered", "escalated") : ""}</div>
        <div class="card-b">${esc(detail)}</div></div>`;
    }).join("") : `<div class="note info">No individual carries enough uncovered processes
      to be a concern.</div>`;

    return phead("Dashboard", "Where work is actually stuck",
      "Queue times, bottlenecks, orphaned processes and single points of failure — computed live " +
      "against simulated time.") +
      `<p class="muted" style="margin-bottom:11px">Simulated time
        <span class="mono">${esc(fmtTime(at))}</span></p>
      <div class="tiles">
        ${tile("Open requests", String(h.open_requests), "of " + h.total_requests + " raised")}
        ${tile("Avg time to acknowledge", h.avg_ack_hours.toFixed(1) + "h", "first response")}
        ${tile("Avg time to complete", h.avg_cycle_hours.toFixed(1) + "h", "raised to closed")}
        ${tile("Escalation rate", Math.round(h.escalation_rate) + "%",
               h.escalated_requests + " escalated", h.escalation_rate >= 20 ? "bad" : "")}
        ${tile("Oldest open item", Math.round(h.oldest_open_hours) + "h", "still waiting",
               h.oldest_open_hours >= 48 ? "warn" : "")}
      </div>
      <div class="sect"><h2>Queue</h2></div>${charts}
      <div class="sect"><h2>Bottlenecks</h2><p>Who the open queue is piling up behind.</p></div>

      <div class="stack">${orphanCards}</div>

  }
