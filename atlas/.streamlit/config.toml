[theme]
base = "light"
primaryColor = "#1B4D3E"
backgroundColor = "#FBF8F0"
secondaryBackgroundColor = "#F4EEE0"
textColor = "#1E2A25"

[browser]
gatherUsageStats = false

[server]
# Hosted runs never have a browser to open. `python run.py` passes
# --server.headless explicitly, so local runs still open one.
headless = true
fileWatcherType = "auto"

[client]
toolbarMode = "minimal"
showErrorDetails = true
