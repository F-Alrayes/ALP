[theme]
base = "light"
primaryColor = "#14382A"
backgroundColor = "#FAF6EB"
secondaryBackgroundColor = "#F4EEDD"
textColor = "#1B2721"

[browser]
gatherUsageStats = false

[server]
# Hosted runs never have a browser to open. `python run.py` passes
# --server.headless explicitly, so local runs still open one.
headless = true
fileWatcherType = "auto"

[client]
toolbarMode = "minimal"
showErrorDetails = true
